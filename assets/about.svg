<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Patterns -->
    <pattern id="aboutGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16382C" stroke-width="0.6" />
    </pattern>
  </defs>

  <!-- Midnight Emerald Canvas (#10251F) -->
  <rect width="1200" height="340" rx="8" fill="#10251F" />
  <rect width="1200" height="340" rx="8" fill="url(#aboutGrid)" opacity="0.6" />
  <rect x="1" y="1" width="1198" height="338" rx="8" fill="none" stroke="#315544" stroke-width="1.2" />

  <!-- ============================================== -->
  <!-- LEFT: TERMINAL CLI WINDOW (Width: 700px)       -->
  <!-- ============================================== -->
  <g transform="translate(24, 20)">
    <!-- Terminal Outer Frame (#142E25) -->
    <rect width="700" height="300" rx="6" fill="#142E25" stroke="#315544" stroke-width="1" />

    <!-- Terminal Header Bar -->
    <rect width="700" height="30" rx="6" fill="#19392D" />
    <!-- Terminal Traffic Light Buttons -->
    <circle cx="18" cy="15" r="4.5" fill="#32805B" />
    <circle cx="34" cy="15" r="4.5" fill="#315544" />
    <circle cx="50" cy="15" r="4.5" fill="#214635" />

    <!-- Title Bar Text -->
    <text x="350" y="19" fill="#A8BCAF" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" text-anchor="middle">
      sawan@portfolio: ~
    </text>

    <!-- Terminal Inner Text Session -->
    <g transform="translate(22, 54)" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="11" line-height="1.5">
      <!-- $ whoami -->
      <text x="0" y="0">
        <tspan fill="#68A786" font-weight="700">$ </tspan>
        <tspan fill="#E1EAE3" font-weight="600">whoami</tspan>
      </text>
      <text x="0" y="18" fill="#A8BCAF">
        Sawan Sahani • Systems Architect &amp; Full-Stack Developer
      </text>

      <!-- $ cat education.txt -->
      <text x="0" y="44">
        <tspan fill="#68A786" font-weight="700">$ </tspan>
        <tspan fill="#E1EAE3" font-weight="600">cat education.txt</tspan>
      </text>
      <text x="0" y="62" fill="#A8BCAF">
        B.Tech in Computer Science &amp; Engineering • Undergraduate
      </text>

      <!-- $ cat focus.txt -->
      <text x="0" y="88">
        <tspan fill="#68A786" font-weight="700">$ </tspan>
        <tspan fill="#E1EAE3" font-weight="600">cat focus.txt</tspan>
      </text>
      <text x="0" y="106" fill="#A8BCAF">
        Next.js 16 App Router • TypeScript • Three.js/R3F • Supabase &amp; C++20 DSA
      </text>

      <!-- $ ls ./shipped -->
      <text x="0" y="132">
        <tspan fill="#68A786" font-weight="700">$ </tspan>
        <tspan fill="#E1EAE3" font-weight="600">ls ./shipped</tspan>
      </text>
      <text x="0" y="150" fill="#68A786" font-weight="700">
        arinova/   sourca/   codeascend/   algorithmic-solutions/
      </text>

      <!-- $ echo $PRINCIPLE -->
      <text x="0" y="176">
        <tspan fill="#68A786" font-weight="700">$ </tspan>
        <tspan fill="#E1EAE3" font-weight="600">echo $PRINCIPLE</tspan>
      </text>
      <text x="0" y="196" fill="#E1EAE3" font-weight="600">
        &quot;Rigorous logic beneath the surface; intentional design on top.&quot;
      </text>
      <text x="0" y="222" fill="#32805B">
        status: actively engineering • systems green
      </text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- RIGHT: 3 STACKED CARDS (Width: 428px)          -->
  <!-- ============================================== -->
  <g transform="translate(748, 20)">

    <!-- Card 1: PRIMARY LANGUAGE (C++20) -->
    <g transform="translate(0, 0)">
      <rect width="428" height="92" rx="6" fill="#142E25" stroke="#315544" stroke-width="1" />
      <g transform="translate(20, 16)">
        <text x="0" y="10" fill="#32805B" font-family="'Fira Code', monospace" font-size="9" font-weight="700" letter-spacing="1">
          PRIMARY LANGUAGE
        </text>
        <rect x="330" y="-3" width="58" height="18" rx="3" fill="#214635" stroke="#32805B" stroke-width="0.8" />
        <text x="359" y="9" fill="#68A786" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="middle">PRIMARY</text>

        <text x="0" y="38" fill="#E1EAE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">
          C++20
        </text>
        <text x="0" y="58" fill="#A8BCAF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
          Data Structures • Algorithms • Asymptotic Optimization
        </text>
      </g>
    </g>

    <!-- Card 2: WHERE FULL-STACK LIVES (TypeScript) -->
    <g transform="translate(0, 104)">
      <rect width="428" height="92" rx="6" fill="#142E25" stroke="#315544" stroke-width="1" />
      <g transform="translate(20, 16)">
        <text x="0" y="10" fill="#32805B" font-family="'Fira Code', monospace" font-size="9" font-weight="700" letter-spacing="1">
          WHERE FULL-STACK LIVES
        </text>
        <rect x="316" y="-3" width="72" height="18" rx="3" fill="#19392D" stroke="#315544" stroke-width="0.8" />
        <text x="352" y="9" fill="#E1EAE3" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="middle">REACT 19</text>

        <text x="0" y="38" fill="#E1EAE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">
          TypeScript
        </text>
        <text x="0" y="58" fill="#A8BCAF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
          Next.js 16 • React 19 • Three.js/R3F • Tailwind CSS
        </text>
      </g>
    </g>

    <!-- Card 3: DRAWN TO (System Architecture) -->
    <g transform="translate(0, 208)">
      <rect width="428" height="92" rx="6" fill="#142E25" stroke="#315544" stroke-width="1" />
      <g transform="translate(20, 16)">
        <text x="0" y="10" fill="#32805B" font-family="'Fira Code', monospace" font-size="9" font-weight="700" letter-spacing="1">
          DRAWN TO
        </text>
        <rect x="306" y="-3" width="82" height="18" rx="3" fill="#214635" stroke="#68A786" stroke-width="0.8" />
        <text x="347" y="9" fill="#68A786" font-family="'Fira Code', monospace" font-size="8" font-weight="700" text-anchor="middle">PERSISTENCE</text>

        <text x="0" y="38" fill="#E1EAE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">
          System Architecture
        </text>
        <text x="0" y="58" fill="#A8BCAF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
          Supabase BaaS • PostgreSQL • Row Level Security (RLS)
        </text>
      </g>
    </g>

  </g>
</svg>
