<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" width="540" height="430">
  <defs>
    <!-- Sapphire Gradients -->
    <linearGradient id="lanyardSapphire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142441" />
      <stop offset="50%" stop-color="#4169C1" />
      <stop offset="100%" stop-color="#142441" />
    </linearGradient>

    <linearGradient id="clipMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30486D" />
      <stop offset="35%" stop-color="#6289E8" />
      <stop offset="50%" stop-color="#DCE4F0" />
      <stop offset="65%" stop-color="#6289E8" />
      <stop offset="100%" stop-color="#30486D" />
    </linearGradient>

    <linearGradient id="cardSapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142441" />
      <stop offset="100%" stop-color="#1B3155" />
    </linearGradient>

    <linearGradient id="hologramSapphire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4169C1" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6289E8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#DCE4F0" stop-opacity="0.9" />
    </linearGradient>

    <!-- Pendulum Swing Animation with Reduced Motion Fallback -->
    <style>
      @keyframes pendulumSwing {
        0% { transform: rotate(-1.6deg); }
        50% { transform: rotate(1.6deg); }
        100% { transform: rotate(-1.6deg); }
      }
      .pendulum-group {
        transform-origin: 270px 15px;
        animation: pendulumSwing 6.5s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .pendulum-group { animation: none !important; transform: none !important; }
      }
    </style>
  </defs>

  <!-- Hanging Lanyard Ribbon Straps (#1B3155 / #4169C1) -->
  <g stroke="#30486D" stroke-width="0.8">
    <polygon points="261,0 263,48 277,48 279,0" fill="url(#lanyardSapphire)" />
    <!-- Fine inner ribbon stitching -->
    <line x1="265" y1="0" x2="266" y2="48" stroke="#6289E8" stroke-width="0.6" stroke-dasharray="2 2" />
    <line x1="273" y1="0" x2="274" y2="48" stroke="#6289E8" stroke-width="0.6" stroke-dasharray="2 2" />
  </g>

  <!-- Pendulum Oscillating Unit -->
  <g class="pendulum-group">
    <!-- Brushed Metallic Clasp -->
    <g transform="translate(254, 46)">
      <rect x="0" y="0" width="32" height="18" rx="3" fill="url(#clipMetallic)" stroke="#30486D" stroke-width="0.8" />
      <circle cx="16" cy="9" r="3.5" fill="#101B35" stroke="#30486D" stroke-width="0.8" />
      <!-- Swivel Hook Wire -->
      <path d="M 12 18 C 12 28, 20 28, 20 18" fill="none" stroke="url(#clipMetallic)" stroke-width="2.5" />
    </g>

    <!-- Main ID Card Assembly (Anchored at 270, 70) -->
    <g transform="translate(135, 70)">
      <!-- Outer Card Body (Midnight Blue #142441 / #1B3155) -->
      <rect width="270" height="345" rx="10" fill="url(#cardSapphireGrad)" stroke="#30486D" stroke-width="1.4" />
      <rect x="5" y="5" width="260" height="335" rx="8" fill="none" stroke="#223B63" stroke-width="0.8" />

      <!-- Top Lanyard Slot Cutout -->
      <rect x="110" y="10" width="50" height="6" rx="3" fill="#101B35" stroke="#30486D" stroke-width="0.8" />

      <!-- Verified Security Hologram Badge -->
      <g transform="translate(195, 24)">
        <polygon points="12,0 24,12 12,24 0,12" fill="url(#hologramSapphire)" opacity="0.85" />
        <circle cx="12" cy="12" r="5" fill="#101B35" />
        <circle cx="12" cy="12" r="2.5" fill="#6289E8" />
      </g>

      <!-- Department / Security Header -->
      <text x="135" y="38" fill="#6289E8" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">
        DEVELOPER CREDENTIAL • VERIFIED
      </text>

      <line x1="20" y1="48" x2="250" y2="48" stroke="#30486D" stroke-width="0.8" />

      <!-- Photo Enclosure (#223B63) -->
      <g transform="translate(80, 60)">
        <rect width="110" height="110" rx="6" fill="#223B63" stroke="#4169C1" stroke-width="1.2" />
        <rect x="3" y="3" width="104" height="104" rx="4" fill="#1B3155" />

        <!-- Stylized Developer Silhouette Vector -->
        <g transform="translate(55, 62)">
          <!-- Head -->
          <circle cx="0" cy="-18" r="16" fill="#142441" stroke="#6289E8" stroke-width="1.2" />
          <!-- Glasses -->
          <rect x="-12" y="-21" width="10" height="7" rx="1.5" fill="none" stroke="#DCE4F0" stroke-width="1" />
          <rect x="2" y="-21" width="10" height="7" rx="1.5" fill="none" stroke="#DCE4F0" stroke-width="1" />
          <line x1="-2" y1="-18" x2="2" y2="-18" stroke="#DCE4F0" stroke-width="1" />
          <!-- Hairline -->
          <path d="M -16 -23 Q 0 -35 16 -23 Q 0 -27 -16 -23" fill="#6289E8" />
          <!-- Shoulders / Bust -->
          <path d="M -32 28 C -32 6, -18 2, 0 2 C 18 2, 32 6, 32 28 Z" fill="#142441" stroke="#30486D" stroke-width="1" />
          <!-- Small Verified Jewel Badge on photo -->
          <circle cx="36" cy="36" r="8" fill="#101B35" stroke="#6289E8" stroke-width="1" />
          <text x="36" y="39.5" fill="#6289E8" font-family="'Fira Code', monospace" font-size="8" font-weight="800" text-anchor="middle">&gt;</text>
        </g>
      </g>

      <!-- Developer Credentials Info -->
      <g transform="translate(135, 192)" text-anchor="middle">
        <!-- Name (Silver #DCE4F0) -->
        <text x="0" y="0" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="-0.3">
          Sawan Sahani
        </text>

        <!-- Handle (Sapphire #6289E8) -->
        <text x="0" y="18" fill="#6289E8" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600">
          @Sawan017
        </text>

        <!-- Role Capsule (#223B63) -->
        <g transform="translate(0, 30)">
          <rect x="-95" y="0" width="190" height="22" rx="3" fill="#223B63" stroke="#4169C1" stroke-width="0.8" />
          <text x="0" y="14" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8">
            FULL-STACK • ALGORITHMS
          </text>
        </g>

        <!-- Details Grid -->
        <g transform="translate(-100, 68)" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">
          <text x="0" y="0" fill="#AAB8CE" font-weight="600">DEPT:</text>
          <text x="38" y="0" fill="#DCE4F0" font-weight="500">Computer Science &amp; Eng.</text>

          <text x="0" y="14" fill="#AAB8CE" font-weight="600">ROLE:</text>
          <text x="38" y="14" fill="#DCE4F0" font-weight="500">Systems &amp; Platform Dev</text>

          <text x="0" y="28" fill="#AAB8CE" font-weight="600">STATUS:</text>
          <text x="38" y="28" fill="#6289E8" font-weight="700">ACTIVE CONTRIBUTOR</text>
        </g>
      </g>

      <!-- Bottom Barcode Strip (#101B35 base with #6289E8 code) -->
      <g transform="translate(45, 308)">
        <rect x="0" y="0" width="180" height="24" rx="2" fill="#101B35" stroke="#30486D" stroke-width="0.6" />
        <!-- Procedural Bars in Sapphire & Slate -->
        <g fill="#6289E8">
          <rect x="10" y="3" width="2" height="14" />
          <rect x="14" y="3" width="4" height="14" />
          <rect x="20" y="3" width="1" height="14" />
          <rect x="23" y="3" width="3" height="14" />
          <rect x="29" y="3" width="2" height="14" />
          <rect x="33" y="3" width="5" height="14" />
          <rect x="40" y="3" width="1" height="14" />
          <rect x="43" y="3" width="3" height="14" />
          <rect x="48" y="3" width="2" height="14" />
          <rect x="52" y="3" width="4" height="14" />
          <rect x="58" y="3" width="2" height="14" />
          <rect x="63" y="3" width="1" height="14" />
          <rect x="66" y="3" width="3" height="14" />
          <rect x="71" y="3" width="2" height="14" />
          <rect x="75" y="3" width="5" height="14" />
          <rect x="82" y="3" width="2" height="14" />
          <rect x="86" y="3" width="1" height="14" />
          <rect x="89" y="3" width="4" height="14" />
          <rect x="95" y="3" width="2" height="14" />
          <rect x="99" y="3" width="3" height="14" />
          <rect x="104" y="3" width="1" height="14" />
          <rect x="107" y="3" width="5" height="14" />
          <rect x="114" y="3" width="2" height="14" />
          <rect x="118" y="3" width="3" height="14" />
          <rect x="123" y="3" width="1" height="14" />
          <rect x="126" y="3" width="4" height="14" />
          <rect x="132" y="3" width="2" height="14" />
          <rect x="136" y="3" width="2" height="14" />
          <rect x="140" y="3" width="4" height="14" />
          <rect x="146" y="3" width="1" height="14" />
          <rect x="149" y="3" width="3" height="14" />
          <rect x="154" y="3" width="2" height="14" />
          <rect x="158" y="3" width="4" height="14" />
          <rect x="164" y="3" width="2" height="14" />
          <rect x="168" y="3" width="3" height="14" />
        </g>
        <text x="90" y="21" fill="#AAB8CE" font-family="'Fira Code', monospace" font-size="5" text-anchor="middle" letter-spacing="1">
          DEV-017-SAWAN-VERIFIED
        </text>
      </g>
    </g>
  </g>
</svg>
