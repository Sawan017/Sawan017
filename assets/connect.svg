      </text>
      <text x="500" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="end">
        AI PLATFORM // EVALUATION
      </text>
    </g>

    <!-- Narrative Description -->
    <text x="24" y="68" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">
      <tspan x="24" dy="0">Campus recruitment &amp; technical assessment platform delivering dynamic</tspan>
      <tspan x="24" dy="17">coding puzzles, automated test-suite verification, recruiter benchmarking,</tspan>
      <tspan x="24" dy="17">and Google GenAI-powered code evaluations with strict scoring criteria.</tspan>
    </text>

    <!-- Subsystem Highlights -->
    <g transform="translate(24, 132)">
      <rect width="497" height="30" rx="3" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
      <text x="12" y="19" fill="#6289E8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">
        SUBSYSTEMS: Google GenAI Evaluator • Sandbox Test Runner • Recruiter Portal
      </text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(24, 172)">
      <text x="0" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600">
        Next.js 16 • TypeScript • Google GenAI • Supabase SSR • Monaco • Tailwind
      </text>
    </g>
  </g>

  <!-- CARD 3: CodeAscend (Bottom-Left) -->
  <g transform="translate(40, 295)">
    <rect width="545" height="205" rx="6" fill="#142441" stroke="#30486D" stroke-width="1" />
    <rect x="0" y="0" width="5" height="205" rx="2" fill="#4169C1" />

    <!-- Header -->
    <g transform="translate(24, 24)">
      <text x="0" y="14" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">
        🚀 CodeAscend — Skill &amp; Milestone Tracker
      </text>
      <text x="500" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="end">
        ROADMAP // TRACKER
      </text>
    </g>

    <!-- Narrative Description -->
    <text x="24" y="68" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">
      <tspan x="24" dy="0">Developer progression tracking ecosystem featuring structured career</tspan>
      <tspan x="24" dy="17">roadmaps, milestone verification, and modular full-stack component</tspan>
      <tspan x="24" dy="17">architecture with cloud synchronization across learning workflows.</tspan>
    </text>

    <!-- Subsystem Highlights -->
    <g transform="translate(24, 132)">
      <rect width="497" height="30" rx="3" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
      <text x="12" y="19" fill="#6289E8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">
        SUBSYSTEMS: Milestone Tree • Analytics Engine • Cloud State Synchronization
      </text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(24, 172)">
      <text x="0" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600">
        TypeScript • React 19 • Supabase • Tailwind CSS • RESTful APIs
      </text>
    </g>
  </g>

  <!-- CARD 4: Algorithmic Solutions & CP (Bottom-Right) -->
  <g transform="translate(615, 295)">
    <rect width="545" height="205" rx="6" fill="#142441" stroke="#30486D" stroke-width="1" />
    <rect x="0" y="0" width="5" height="205" rx="2" fill="#6289E8" />

    <!-- Header -->
    <g transform="translate(24, 24)">
      <text x="0" y="14" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">
        ⚔️ Algorithmic Solutions &amp; CP
      </text>
      <text x="500" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="end">
        C++20 // RIGOR
      </text>
    </g>

    <!-- Narrative Description -->
    <text x="24" y="68" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">
      <tspan x="24" dy="0">High-performance solutions in modern C++20 for competitive contests</tspan>
      <tspan x="24" dy="17">and asymptotic algorithmic challenges on LeetCode and Codeforces.</tspan>
      <tspan x="24" dy="17">Focusing on Dynamic Programming, Graph Theory, and Memory Optimization.</tspan>
    </text>

    <!-- Subsystem Highlights -->
    <g transform="translate(24, 132)">
      <rect width="497" height="30" rx="3" fill="#223B63" stroke="#4169C1" stroke-width="0.8" />
      <text x="12" y="19" fill="#6289E8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">
        SUBSYSTEMS: DP Optimization • Graph Algorithms • Asymptotic Verification
      </text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(24, 172)">
      <text x="0" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600">
        C++20 • STL • Graphs • Dynamic Programming • LeetCode • Codeforces
      </text>
    </g>
