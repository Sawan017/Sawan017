<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
  <defs>
    <!-- Sapphire Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4169C1" />
      <stop offset="50%" stop-color="#6289E8" />
      <stop offset="100%" stop-color="#DCE4F0" />
    </linearGradient>

    <!-- Deep Midnight Grid -->
    <pattern id="connectGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#162746" stroke-width="0.6" />
    </pattern>
  </defs>

  <!-- Deep Midnight Blue Base (#101B35) -->
  <rect width="1200" height="540" fill="#101B35" />
  <rect width="1200" height="540" fill="url(#connectGrid)" opacity="0.85" />
  <rect x="1" y="1" width="1198" height="538" fill="none" stroke="#30486D" stroke-width="1.2" rx="6" />

  <!-- Corner Precision Accents -->
  <g stroke="#6289E8" stroke-width="1.2" opacity="0.85">
    <path d="M 12 24 L 12 12 L 24 12" fill="none" />
    <path d="M 1188 24 L 1188 12 L 1176 12" fill="none" />
    <path d="M 12 516 L 12 528 L 24 528" fill="none" />
    <path d="M 1188 516 L 1188 528 L 1176 528" fill="none" />
  </g>

  <!-- Title Header -->
  <g transform="translate(40, 32)">
    <rect width="170" height="22" rx="3" fill="#142441" stroke="#4169C1" stroke-width="0.8" />
    <text x="85" y="15" fill="#6289E8" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="1">
      FLAGSHIP ECOSYSTEM
    </text>
    <text x="185" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">
      Production Systems, AI Engines &amp; Algorithmic Solutions
    </text>
  </g>

  <!-- ============================================== -->
  <!-- 2x2 PROJECT SHOWCASE CARDS                     -->
  <!-- ============================================== -->

  <!-- CARD 1: ARINOVA (Top-Left) -->
  <g transform="translate(40, 75)">
    <rect width="545" height="205" rx="6" fill="#142441" stroke="#30486D" stroke-width="1" />
    <rect x="0" y="0" width="5" height="205" rx="2" fill="#6289E8" />
    
    <!-- Header -->
    <g transform="translate(24, 24)">
      <text x="0" y="14" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">
        👑 ARINOVA — Developer Career RPG
      </text>
      <text x="500" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="10" font-weight="700" text-anchor="end">
        FLAGSHIP // 3D WEB
      </text>
    </g>

    <!-- Narrative Description -->
    <text x="24" y="68" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">
      <tspan x="24" dy="0">Futuristic developer RPG turning real-world coding quests into an</tspan>
      <tspan x="24" dy="17">interactive adventure. Combines a 3D Three.js/R3F world with Monaco</tspan>
      <tspan x="24" dy="17">code editor, dynamic skill trees, and real-time social networking.</tspan>
    </text>

    <!-- Subsystem Highlights -->
    <g transform="translate(24, 132)">
      <rect width="497" height="30" rx="3" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
      <text x="12" y="19" fill="#6289E8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">
        SUBSYSTEMS: 3D SceneGraph • Monaco IDE • Dynamic RPG Quest Engine
      </text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(24, 172)">
      <text x="0" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600">
        React 19 • TypeScript • Three.js • Supabase • Monaco • Framer Motion
      </text>
    </g>
  </g>

  <!-- CARD 2: SourCa (Top-Right) -->
  <g transform="translate(615, 75)">
    <rect width="545" height="205" rx="6" fill="#142441" stroke="#30486D" stroke-width="1" />
    <rect x="0" y="0" width="5" height="205" rx="2" fill="#4169C1" />

    <!-- Header -->
    <g transform="translate(24, 24)">
      <text x="0" y="14" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">
