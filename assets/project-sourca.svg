<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="100%" height="auto">
  <defs>
    <linearGradient id="sourcaCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190612" />
      <stop offset="60%" stop-color="#240B1A" />
      <stop offset="100%" stop-color="#13040E" />
    </linearGradient>

    <linearGradient id="sourcaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B82E64" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7E1944" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="wineBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A132C" />
      <stop offset="50%" stop-color="#B82E64" />
      <stop offset="100%" stop-color="#ECA8BC" />
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="580" height="300" rx="14" fill="url(#sourcaCardBg)" stroke="#4A142D" stroke-width="1.2" />
  <rect width="580" height="300" rx="14" fill="url(#sourcaGlow)" />

  <!-- Top Right Conceptual Art: AI Assessment Radar / Terminal -->
  <g transform="translate(470, 75)">
    <!-- Radar concentric rings -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#7E1944" stroke-width="0.8" opacity="0.6" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#B82E64" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.7" />
    <!-- Radar crosshairs -->
    <line x1="-42" y1="0" x2="42" y2="0" stroke="#5A132C" stroke-width="0.7" />
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#5A132C" stroke-width="0.7" />
    <!-- Assessment polygon -->
    <polygon points="0,-28 20,-10 14,18 -18,14 -22,-6" fill="#B82E64" fill-opacity="0.3" stroke="#ECA8BC" stroke-width="1.2" />
    <circle cx="0" cy="-28" r="2" fill="#ECA8BC" />
    <circle cx="20" cy="-10" r="2" fill="#ECA8BC" />
    <circle cx="14" cy="18" r="2" fill="#ECA8BC" />
  </g>

  <!-- Top Header Pill -->
  <g transform="translate(24, 24)">
    <rect width="216" height="22" rx="11" fill="#340E24" stroke="#68193D" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#ECA8BC" />
    <text x="24" y="15" fill="#ECA8BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">AI RECRUITMENT &bull; ASSESSMENT</text>
  </g>

  <!-- Title -->
  <text x="24" y="82" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Playfair Display', serif" font-size="26" font-weight="800" letter-spacing="-0.3">
    SourCa
  </text>
  <text x="135" y="82" fill="#D96B8A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    Placement &amp; Challenge Engine
  </text>

  <!-- Description -->
  <text x="24" y="112" fill="#DDBCC9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
    <tspan x="24" dy="0">An intelligent campus recruitment &amp; technical assessment platform</tspan>
    <tspan x="24" dy="19">delivering dynamic algorithmic puzzles, automated test-suite</tspan>
    <tspan x="24" dy="19">verification, and AI-assisted candidate competency scoring.</tspan>
  </text>

  <!-- Conceptual Terminal / Metric Strip -->
  <g transform="translate(24, 180)">
    <rect width="532" height="38" rx="8" fill="#180512" stroke="#401228" stroke-width="1" />
    <text x="14" y="24" fill="#ECA8BC" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="600">&gt; automated_tests: 12/12 PASSED</text>
    <rect x="290" y="8" width="112" height="22" rx="4" fill="#2C0A1E" stroke="#5A1633" stroke-width="0.8" />
    <text x="346" y="22" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">GENAI POWERED</text>
    <rect x="410" y="8" width="110" height="22" rx="4" fill="#2C0A1E" stroke="#5A1633" stroke-width="0.8" />
    <text x="465" y="22" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">MONACO RUNNER</text>
  </g>

  <!-- Stack Pills Bar -->
  <g transform="translate(24, 236)">
    <rect x="0" y="0" width="82" height="24" rx="12" fill="#290B1E" stroke="#4A142D" stroke-width="0.8" />
    <text x="41" y="16" fill="#F2D8E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Next.js 16</text>

    <rect x="88" y="0" width="86" height="24" rx="12" fill="#290B1E" stroke="#4A142D" stroke-width="0.8" />
    <text x="131" y="16" fill="#F2D8E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="180" y="0" width="96" height="24" rx="12" fill="#290B1E" stroke="#4A142D" stroke-width="0.8" />
    <text x="228" y="16" fill="#F2D8E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Google GenAI</text>

    <rect x="282" y="0" width="82" height="24" rx="12" fill="#290B1E" stroke="#4A142D" stroke-width="0.8" />
    <text x="323" y="16" fill="#F2D8E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Supabase</text>

    <rect x="370" y="0" width="76" height="24" rx="12" fill="#290B1E" stroke="#4A142D" stroke-width="0.8" />
    <text x="408" y="16" fill="#F2D8E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Monaco</text>

    <rect x="452" y="0" width="80" height="24" rx="12" fill="#290B1E" stroke="#4A142D" stroke-width="0.8" />
    <text x="492" y="16" fill="#F2D8E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Tailwind v4</text>
  </g>

  <!-- Bottom Accent Highlight -->
  <rect x="0" y="297" width="580" height="3" rx="1.5" fill="url(#wineBar)" />
</svg>
