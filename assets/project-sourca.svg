<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="580" height="280">
  <!-- Deep Midnight Blue Card Background (#101B35 / #142441) -->
  <rect width="580" height="280" fill="#101B35" />
  <rect width="580" height="280" fill="#142441" opacity="0.75" />
  <rect x="0.5" y="0.5" width="579" height="279" fill="none" stroke="#30486D" stroke-width="1.2" rx="6" />

  <!-- Top Accent Bar (Sapphire Gradient) -->
  <rect x="0" y="0" width="580" height="3" fill="#1B3155" />
  <rect x="0" y="0" width="160" height="3" fill="#4169C1" />

  <!-- Top Badge -->
  <g transform="translate(24, 22)">
    <rect width="210" height="22" rx="4" fill="#1B3155" stroke="#4169C1" stroke-width="0.8" />
    <circle cx="12" cy="11" r="3" fill="#6289E8" />
    <text x="22" y="15" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">AI ASSESSMENT • PLACEMENT</text>
  </g>

  <!-- Right Geometric Conceptual Illustration: AI Brain & Synapses -->
  <g transform="translate(485, 75)" opacity="0.75">
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#30486D" stroke-width="1" stroke-dasharray="3 3" />
    <!-- Neural Nodes -->
    <circle cx="-25" cy="-12" r="7" fill="#1B3155" stroke="#4169C1" stroke-width="1.2" />
    <circle cx="0" cy="8" r="8.5" fill="#223B63" stroke="#6289E8" stroke-width="1.4" />
    <circle cx="28" cy="-8" r="6" fill="#1B3155" stroke="#4169C1" stroke-width="1.2" />
    <!-- Synaptic Connecting Lines -->
    <line x1="-25" y1="-12" x2="0" y2="8" stroke="#6289E8" stroke-width="1.2" />
    <line x1="0" y1="8" x2="28" y2="-8" stroke="#6289E8" stroke-width="1.2" />
    <line x1="-25" y1="-12" x2="28" y2="-8" stroke="#30486D" stroke-width="0.8" stroke-dasharray="2 2" />
    <circle cx="0" cy="8" r="3" fill="#DCE4F0" />
    <circle cx="-38" cy="12" r="1.8" fill="#4169C1" />
  </g>

  <!-- Title (Silver #DCE4F0) -->
  <text x="24" y="78" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">
    SourCa
  </text>
  <text x="125" y="78" fill="#6289E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    AI Assessment &amp; Placement Engine
  </text>

  <!-- Description (Secondary #AAB8CE) -->
  <text x="24" y="108" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" line-height="18">
    <tspan x="24" dy="0">An intelligent campus placement &amp; technical assessment platform</tspan>
    <tspan x="24" dy="18">delivering dynamic coding puzzles, automated test-suite verification,</tspan>
    <tspan x="24" dy="18">recruiter benchmarking, and Google GenAI-powered code evaluations.</tspan>
  </text>

  <!-- Feature Strip (#1B3155) -->
  <g transform="translate(24, 170)">
    <rect width="532" height="32" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="14" y="20" fill="#6289E8" font-family="'Fira Code', Consolas, monospace" font-size="10.5" font-weight="600">
      CORE: GenAI Code Analysis • Automated Test Suites • Recruiter Analytics
    </text>
  </g>

  <!-- Stack Pills Bar -->
  <g transform="translate(24, 222)">
    <rect x="0" y="0" width="85" height="24" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="42" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Next.js 16</text>

    <rect x="93" y="0" width="86" height="24" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="136" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="187" y="0" width="105" height="24" rx="4" fill="#223B63" stroke="#4169C1" stroke-width="0.8" />
    <text x="239" y="16" fill="#6289E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Google GenAI</text>

    <rect x="300" y="0" width="100" height="24" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="350" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Supabase SSR</text>

    <rect x="408" y="0" width="95" height="24" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="455" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Tailwind CSS</text>
  </g>
</svg>
