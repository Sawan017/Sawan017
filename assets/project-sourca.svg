<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="100%" height="auto">
  <!-- Card Background -->
  <rect width="580" height="280" fill="#171A18" />
  <rect width="580" height="280" fill="#1C201E" opacity="0.6" />
  <rect x="0.5" y="0.5" width="579" height="279" fill="none" stroke="#2C332D" stroke-width="1" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="580" height="2" fill="#24382F" />
  <rect x="0" y="0" width="140" height="2" fill="#69735A" />

  <!-- Top Badge -->
  <g transform="translate(24, 22)">
    <rect width="216" height="22" rx="4" fill="#24382F" stroke="#37453C" stroke-width="1" />
    <circle cx="12" cy="11" r="3" fill="#829078" />
    <text x="22" y="15" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">AI ASSESSMENT &bull; RECRUITMENT</text>
  </g>

  <!-- Right Geometric Conceptual Illustration: Assessment Evaluation Radar -->
  <g transform="translate(485, 75)" opacity="0.65">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#24382F" stroke-width="0.8" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#454C35" stroke-width="0.8" stroke-dasharray="2 3" />
    <line x1="-38" y1="0" x2="38" y2="0" stroke="#24382F" stroke-width="0.7" />
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#24382F" stroke-width="0.7" />
    <polygon points="0,-24 18,-8 12,16 -16,12 -20,-6" fill="#24382F" fill-opacity="0.4" stroke="#69735A" stroke-width="1" />
    <circle cx="0" cy="-24" r="1.8" fill="#829078" />
    <circle cx="18" cy="-8" r="1.8" fill="#829078" />
    <circle cx="12" cy="16" r="1.8" fill="#829078" />
  </g>

  <!-- Title -->
  <text x="24" y="78" fill="#EDECE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">
    SourCa
  </text>
  <text x="135" y="78" fill="#829078" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    Campus Placement &amp; Challenge Engine
  </text>

  <!-- Description -->
  <text x="24" y="108" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
    <tspan x="24" dy="0">An intelligent campus recruitment &amp; technical assessment platform</tspan>
    <tspan x="24" dy="18">delivering dynamic algorithmic puzzles, automated test-suite</tspan>
    <tspan x="24" dy="18">verification, and AI-assisted candidate competency scoring.</tspan>
  </text>

  <!-- Feature Strip -->
  <g transform="translate(24, 170)">
    <rect width="532" height="32" rx="4" fill="#151816" stroke="#262D27" stroke-width="0.8" />
    <text x="14" y="20" fill="#829078" font-family="'Fira Code', Consolas, monospace" font-size="10.5" font-weight="600">
      &gt; automated_tests: 12/12 PASSED &bull; GenAI Evaluation Active
    </text>
  </g>

  <!-- Stack Pills Bar -->
  <g transform="translate(24, 222)">
    <rect x="0" y="0" width="82" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="41" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Next.js 16</text>

    <rect x="90" y="0" width="86" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="133" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="184" y="0" width="96" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="232" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Google GenAI</text>

    <rect x="288" y="0" width="82" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="329" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Supabase</text>

    <rect x="378" y="0" width="76" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="416" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Monaco</text>

    <rect x="462" y="0" width="80" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="502" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Tailwind v4</text>
  </g>
</svg>
