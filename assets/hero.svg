<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
  <defs>
    <!-- Emerald Gradients -->
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142E25" />
      <stop offset="50%" stop-color="#10251F" />
      <stop offset="100%" stop-color="#0E1F1A" />
    </linearGradient>

    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#32805B" />
      <stop offset="50%" stop-color="#68A786" />
      <stop offset="100%" stop-color="#32805B" />
    </linearGradient>

    <!-- Technical Background Grid -->
    <pattern id="heroGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#16382C" stroke-width="0.7" />
      <circle cx="36" cy="0" r="1" fill="#32805B" opacity="0.3" />
      <circle cx="0" cy="36" r="1" fill="#32805B" opacity="0.3" />
    </pattern>

    <!-- CSS Animations -->
    <style>
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes spinOrbital {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.04); }
      }
      .cursor-blink {
        animation: blinkCursor 1.1s infinite;
      }
      .orbital-spin {
        transform-origin: 950px 220px;
        animation: spinOrbital 40s linear infinite;
      }
      .aura-glow {
        transform-origin: 950px 220px;
        animation: pulseAura 4s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor-blink, .orbital-spin, .aura-glow {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Deep Midnight Emerald Base Card (#10251F) -->
  <rect width="1200" height="460" rx="10" fill="url(#heroCardGrad)" stroke="#315544" stroke-width="1.2" />
  <rect width="1200" height="460" rx="10" fill="url(#heroGrid)" opacity="0.75" />
  <rect x="6" y="6" width="1188" height="448" rx="8" fill="none" stroke="#19392D" stroke-width="0.8" />

  <!-- Corner Precision Brackets -->
  <g stroke="#68A786" stroke-width="1.2" opacity="0.75">
    <path d="M 18 30 L 18 18 L 30 18" fill="none" />
    <path d="M 1182 30 L 1182 18 L 1170 18" fill="none" />
    <path d="M 18 430 L 18 442 L 30 442" fill="none" />
    <path d="M 1182 430 L 1182 442 L 1170 442" fill="none" />
  </g>

  <!-- ============================================== -->
  <!-- LEFT: EDITORIAL DEVELOPER IDENTITY             -->
  <!-- ============================================== -->
  <g transform="translate(60, 48)">

    <!-- Terminal Prompt Line -->
    <g transform="translate(0, 20)">
      <circle cx="6" cy="6" r="3.5" fill="#68A786" class="cursor-blink" />
      <text x="18" y="10" fill="#68A786" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.5">
        ~ /sawan $ build --resilient
      </text>
    </g>

    <!-- Category Subheader -->
    <text x="0" y="68" fill="#32805B" font-family="'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="2">
      SYSTEMS ARCHITECT • FULL-STACK • ALGORITHMIC RIGOR
    </text>

    <!-- Huge Editorial Headline: Sawan Sahani. -->
    <text x="0" y="132">
      <tspan fill="#E1EAE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-0.8">Sawan </tspan>
      <tspan fill="#68A786" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" font-style="italic">Sahani.</tspan>
    </text>

    <!-- Role Subheader -->
    <text x="0" y="172" fill="#68A786" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1">
      FULL-STACK SYSTEMS DEVELOPER • CSE UNDERGRADUATE • ALGORITHMIC SPECIALIST
    </text>

    <!-- Personal Tagline -->
    <text x="0" y="210" fill="#A8BCAF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Architecting resilient platforms. Engineering algorithmic solutions.
    </text>

    <!-- Divider Line inside Card -->
    <line x1="0" y1="240" x2="680" y2="240" stroke="#315544" stroke-width="0.8" />

    <!-- Three Core Engineering Focus Highlights (Pills: #19392D) -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: Web &amp; 3D -->
      <g transform="translate(0, 0)">
        <rect width="215" height="42" rx="4" fill="#19392D" stroke="#315544" stroke-width="0.8" />
        <text x="14" y="19" fill="#E1EAE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">⚡ Modern Web &amp; 3D</text>
        <text x="14" y="32" fill="#A8BCAF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Next.js 16 • React 19 • Three.js</text>
      </g>

      <!-- Pill 2: Algorithmic Rigor -->
      <g transform="translate(230, 0)">
        <rect width="215" height="42" rx="4" fill="#214635" stroke="#32805B" stroke-width="0.8" />
        <text x="14" y="19" fill="#68A786" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">⚔️ Algorithmic Rigor</text>
        <text x="14" y="32" fill="#E1EAE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">C++20 • DSA • LeetCode &amp; CP</text>
      </g>

      <!-- Pill 3: Cloud &amp; Persistence -->
      <g transform="translate(460, 0)">
        <rect width="215" height="42" rx="4" fill="#19392D" stroke="#315544" stroke-width="0.8" />
        <text x="14" y="19" fill="#E1EAE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">☁️ Cloud Persistence</text>
        <text x="14" y="32" fill="#A8BCAF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Supabase BaaS • PostgreSQL • RLS</text>
      </g>
    </g>

    <!-- Footer Metadata inside Banner -->
    <g transform="translate(0, 345)" font-family="'Fira Code', monospace" font-size="10.5">
      <text x="0" y="0" fill="#32805B" font-weight="700">
        B.TECH CSE • CORE SYSTEMS &amp; ARCHITECTURES
      </text>
      <text x="680" y="0" fill="#68A786" font-weight="600" text-anchor="end">
        FLAGSHIPS: ARINOVA • SOURCA • CODEASCEND
      </text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- RIGHT: EDITORIAL TECHNICAL ORBITAL RADAR       -->
  <!-- ============================================== -->
  <g transform="translate(950, 220)">
    <!-- Outer Arch Frame with Subtle Fill (#142E25) -->
    <path d="M -110 -150 C -110 -180, 110 -180, 110 -150 L 110 150 C 110 160, -110 160, -110 150 Z" fill="#142E25" stroke="#315544" stroke-width="1.2" opacity="0.8" />
    <path d="M -102 -145 C -102 -170, 102 -170, 102 -145 L 102 142 C 102 150, -102 150, -102 142 Z" fill="#19392D" opacity="0.5" />

    <!-- Background Radar Grid -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#214635" stroke-width="0.8" stroke-dasharray="2 3" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#315544" stroke-width="1" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#32805B" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Crosshair Lines -->
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#315544" stroke-width="0.8" />
    <line x1="0" y1="-160" x2="0" y2="150" stroke="#315544" stroke-width="0.8" />

    <!-- Rotating Planetary Technical Nodes -->
    <g class="orbital-spin">
      <!-- Node: WEB -->
      <g transform="translate(0, -75)">
        <circle cx="0" cy="0" r="14" fill="#10251F" stroke="#68A786" stroke-width="1.2" />
        <text x="0" y="4" fill="#E1EAE3" font-family="'Fira Code', monospace" font-size="8" font-weight="800" text-anchor="middle">WEB</text>
      </g>
      <!-- Node: 3D -->
      <g transform="translate(75, 0)">
        <circle cx="0" cy="0" r="14" fill="#10251F" stroke="#32805B" stroke-width="1.2" />
        <text x="0" y="4" fill="#68A786" font-family="'Fira Code', monospace" font-size="8" font-weight="800" text-anchor="middle">3D</text>
      </g>
      <!-- Node: ALGO -->
      <g transform="translate(0, 75)">
        <circle cx="0" cy="0" r="14" fill="#10251F" stroke="#68A786" stroke-width="1.2" />
        <text x="0" y="4" fill="#E1EAE3" font-family="'Fira Code', monospace" font-size="8" font-weight="800" text-anchor="middle">ALGO</text>
      </g>
      <!-- Node: CLOUD -->
      <g transform="translate(-75, 0)">
        <circle cx="0" cy="0" r="14" fill="#10251F" stroke="#32805B" stroke-width="1.2" />
        <text x="0" y="4" fill="#68A786" font-family="'Fira Code', monospace" font-size="7.5" font-weight="800" text-anchor="middle">CLOUD</text>
      </g>
    </g>

    <!-- Centerpiece: Architectural Crystal Core -->
    <g>
      <circle cx="0" cy="0" r="26" fill="#10251F" stroke="#32805B" stroke-width="1.4" />
      <polygon points="0,-16 14,-7 14,9 0,18 -14,9 -14,-7" fill="#214635" stroke="#68A786" stroke-width="1" />
      <polygon points="0,-16 14,-7 0,2 -14,-7" fill="#32805B" opacity="0.6" />
      <circle cx="0" cy="2" r="3.5" fill="#E1EAE3" />
    </g>

    <!-- Radial Technical Ticks -->
    <text x="0" y="-120" fill="#68A786" font-family="'Fira Code', monospace" font-size="7.5" font-weight="700" text-anchor="middle">SYS.RADAR // 017</text>
    <text x="0" y="130" fill="#32805B" font-family="'Fira Code', monospace" font-size="7" font-weight="600" text-anchor="middle">ACTIVE TELEMETRY</text>
  </g>
</svg>
