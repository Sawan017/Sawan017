<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="about-title about-desc">
  <title id="about-title">About Sawan Sahani</title>
  <desc id="about-desc">Capabilities and a three-slide interests carousel.</desc>
  <defs>
    <linearGradient id="about-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B16" /><stop offset="1" stop-color="#0A1020" /></linearGradient>
    <pattern id="about-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1" fill="#1C2B4B" opacity="0.65" /></pattern>
    <style>
      @keyframes aboutSlide1 { 0%, 30% { opacity: 1; transform: translateX(0); } 33%, 100% { opacity: 0; transform: translateX(-12px); } }
      @keyframes aboutSlide2 { 0%, 30% { opacity: 0; transform: translateX(12px); } 33%, 63% { opacity: 1; transform: translateX(0); } 66%, 100% { opacity: 0; transform: translateX(-12px); } }
      @keyframes aboutSlide3 { 0%, 63% { opacity: 0; transform: translateX(12px); } 66%, 97% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(12px); } }
      @keyframes aboutProgress1 { 0% { transform: scaleX(0); } 30% { transform: scaleX(1); } 33%, 100% { transform: scaleX(1); } }
      @keyframes aboutProgress2 { 0%, 33% { transform: scaleX(0); } 63% { transform: scaleX(1); } 66%, 100% { transform: scaleX(1); } }
      @keyframes aboutProgress3 { 0%, 66% { transform: scaleX(0); } 97% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
      .about-s1 { animation: aboutSlide1 12s infinite; }
      .about-s2 { animation: aboutSlide2 12s infinite; }
      .about-s3 { animation: aboutSlide3 12s infinite; }
      .about-p1 { animation: aboutProgress1 12s infinite; transform-origin: left center; }
      .about-p2 { animation: aboutProgress2 12s infinite; transform-origin: left center; }
      .about-p3 { animation: aboutProgress3 12s infinite; transform-origin: left center; }
      @media (prefers-reduced-motion: reduce) {
        .about-s1, .about-s2, .about-s3, .about-p1, .about-p2, .about-p3 { animation: none !important; }
        .about-s1 { opacity: 1 !important; transform: none !important; }
        .about-s2, .about-s3 { opacity: 0 !important; }
        .about-p1 { transform: scaleX(1) !important; }
        .about-p2, .about-p3 { transform: scaleX(0) !important; }
      }
    </style>
  </defs>
  <rect x="0.6" y="0.6" width="1198.8" height="378.8" rx="20" fill="url(#about-bg)" stroke="#1C2B4B" stroke-width="1.2" />
  <rect width="1200" height="380" rx="20" fill="url(#about-dots)" opacity="0.55" />
  <line x1="24" y1="1.5" x2="254" y2="1.5" stroke="#247BFF" stroke-width="2" />

  <g transform="translate(50 38)">
    <text x="0" y="0" fill="#247BFF" font-family="'Fira Code',Consolas,monospace" font-size="11" font-weight="800" letter-spacing="1.4">ABOUT / HOW I BUILD</text>
    <text x="0" y="34" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="900">Useful software, carefully made.</text>
    <text x="0" y="61" fill="#A7B2C4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.5">A CSE undergraduate lens on systems, product surfaces, and problem-solving.</text>

    <g transform="translate(0 82)">
      <rect width="505" height="62" rx="10" fill="#0D1322" stroke="#1C2B4B" />
      <text x="17" y="22" fill="#247BFF" font-family="'Fira Code',Consolas,monospace" font-size="10.5" font-weight="800">01 / SYSTEMS</text>
      <text x="17" y="44" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700">C++20 · data structures · runtime discipline</text>
    </g>
    <g transform="translate(0 154)">
      <rect width="505" height="62" rx="10" fill="#0D1322" stroke="#1C2B4B" />
      <text x="17" y="22" fill="#FF354F" font-family="'Fira Code',Consolas,monospace" font-size="10.5" font-weight="800">02 / PLATFORMS</text>
      <text x="17" y="44" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700">TypeScript · React · Supabase · PostgreSQL</text>
    </g>
    <g transform="translate(0 226)">
      <rect width="505" height="62" rx="10" fill="#0D1322" stroke="#1C2B4B" />
      <text x="17" y="22" fill="#247BFF" font-family="'Fira Code',Consolas,monospace" font-size="10.5" font-weight="800">03 / SPATIAL UX</text>
      <text x="17" y="44" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700">Three.js · React Three Fiber · interaction</text>
    </g>
  </g>

  <line x1="590" y1="34" x2="590" y2="346" stroke="#1C2B4B" stroke-dasharray="3 5" />

  <g transform="translate(630 38)">
    <text x="0" y="0" fill="#247BFF" font-family="'Fira Code',Consolas,monospace" font-size="11" font-weight="800" letter-spacing="1.4">INTERESTS / CURRENT CURIOSITY</text>
    <g transform="translate(0 20)">
      <rect width="158" height="4" rx="2" fill="#1C2B4B" /><rect width="158" height="4" rx="2" fill="#247BFF" class="about-p1" />
      <rect x="183" width="158" height="4" rx="2" fill="#1C2B4B" /><rect x="183" width="158" height="4" rx="2" fill="#FF354F" class="about-p2" />
      <rect x="366" width="158" height="4" rx="2" fill="#1C2B4B" /><rect x="366" width="158" height="4" rx="2" fill="#247BFF" class="about-p3" />
    </g>

    <g transform="translate(0 48)">
      <rect width="524" height="252" rx="14" fill="#0D1322" stroke="#1C2B4B" />
      <g transform="translate(24 28)" class="about-s1">
        <text x="0" y="0" fill="#247BFF" font-family="'Fira Code',Consolas,monospace" font-size="10.5" font-weight="800">01 // BUILD</text>
        <text x="0" y="34" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="900">Make the useful thing real.</text>
        <text x="0" y="70" fill="#A7B2C4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">
          <tspan x="0" dy="0">I enjoy turning a rough idea into a working surface:</tspan>
          <tspan x="0" dy="22">clear data flows, honest constraints, and a UI people</tspan>
          <tspan x="0" dy="22">can understand without a tour guide.</tspan>
        </text>
        <rect y="166" width="476" height="28" rx="6" fill="#080D18" stroke="#1C2B4B" /><text x="14" y="185" fill="#247BFF" font-family="'Fira Code',Consolas,monospace" font-size="10">FOCUS: product surfaces · typed systems · small feedback loops</text>
      </g>
      <g transform="translate(24 28)" class="about-s2">
        <text x="0" y="0" fill="#FF354F" font-family="'Fira Code',Consolas,monospace" font-size="10.5" font-weight="800">02 // STUDY</text>
        <text x="0" y="34" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="900">Strengthen the core.</text>
        <text x="0" y="70" fill="#A7B2C4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">
          <tspan x="0" dy="0">DSA practice is a way to build better instincts:</tspan>
          <tspan x="0" dy="22">choose a model, prove the trade-off, then make the</tspan>
          <tspan x="0" dy="22">implementation readable enough to revisit.</tspan>
        </text>
        <rect y="166" width="476" height="28" rx="6" fill="#080D18" stroke="#1C2B4B" /><text x="14" y="185" fill="#FF354F" font-family="'Fira Code',Consolas,monospace" font-size="10">FOCUS: C++20 · asymptotics · graphs · dynamic programming</text>
      </g>
      <g transform="translate(24 28)" class="about-s3">
        <text x="0" y="0" fill="#247BFF" font-family="'Fira Code',Consolas,monospace" font-size="10.5" font-weight="800">03 // EXPLORE</text>
        <text x="0" y="34" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="900">Give software some space.</text>
        <text x="0" y="70" fill="#A7B2C4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">
          <tspan x="0" dy="0">3D interaction is a different kind of systems thinking:</tspan>
          <tspan x="0" dy="22">scene graphs, motion, feedback, and the feeling of</tspan>
          <tspan x="0" dy="22">moving through a product rather than reading one.</tspan>
        </text>
        <rect y="166" width="476" height="28" rx="6" fill="#080D18" stroke="#1C2B4B" /><text x="14" y="185" fill="#247BFF" font-family="'Fira Code',Consolas,monospace" font-size="10">FOCUS: Three.js · R3F · developer tools · human-scale motion</text>
      </g>
    </g>
  </g>
</svg>