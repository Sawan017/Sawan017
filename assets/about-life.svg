<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171B19" />
      <stop offset="50%" stop-color="#1B221E" />
      <stop offset="100%" stop-color="#161A18" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2420" />
      <stop offset="100%" stop-color="#171C19" />
    </linearGradient>

    <!-- Subtle Grid -->
    <pattern id="aboutGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#222825" stroke-width="0.7" />
    </pattern>
  </defs>

  <!-- Container -->
  <rect width="1200" height="300" fill="url(#aboutBg)" stroke="#263C31" stroke-width="1.2" />
  <rect width="1200" height="300" fill="url(#aboutGrid)" opacity="0.6" />

  <!-- Corner Brackets -->
  <g stroke="#B39A61" stroke-width="1.2" opacity="0.8">
    <path d="M 12 24 L 12 12 L 24 12" fill="none" />
    <path d="M 1188 24 L 1188 12 L 1176 12" fill="none" />
    <path d="M 12 276 L 12 288 L 24 288" fill="none" />
    <path d="M 1188 276 L 1188 288 L 1176 288" fill="none" />
  </g>

  <!-- Left Column: Narrative Identity -->
  <g transform="translate(45, 42)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="0" width="130" height="22" rx="3" fill="#263C31" stroke="#3A4E42" stroke-width="0.8" />
    <circle cx="10" cy="11" r="3" fill="#B39A61" />
    <text x="20" y="15" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.2">BACKGROUND</text>

    <!-- Headline -->
    <text x="0" y="52" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">
      Systems Discipline &amp; Natural Craft
    </text>

    <!-- Narrative Paragraph -->
    <text x="0" y="86" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
      <tspan x="0" dy="0">I am <tspan fill="#E5E0D4" font-weight="700">Sawan Sahani</tspan>, a Computer Science &amp; Engineering undergraduate</tspan>
      <tspan x="0" dy="24">dedicated to building high-performance full-stack web architectures and</tspan>
      <tspan x="0" dy="24">mastering asymptotic algorithmic problem-solving. My work balances</tspan>
      <tspan x="0" dy="24">defensive cloud engineering with tactile, interactive user interfaces.</tspan>
    </text>

    <!-- Quote / Motto Box -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="480" height="36" rx="3" fill="#181E1B" stroke="#263C31" stroke-width="1" />
      <line x1="0" y1="0" x2="0" y2="36" stroke="#B39A61" stroke-width="3" />
      <text x="16" y="22" fill="#B39A61" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="600">
        "Rigorous logic beneath the surface; intentional design on top."
      </text>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="565" y1="36" x2="565" y2="264" stroke="#263C31" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Right Column: 4 Strategic Core Cards -->
  <g transform="translate(605, 42)">
    <!-- Header -->
    <rect x="0" y="0" width="160" height="22" rx="3" fill="#263C31" stroke="#3A4E42" stroke-width="0.8" />
    <circle cx="10" cy="11" r="3" fill="#B39A61" />
    <text x="20" y="15" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.2">CORE DISCIPLINES</text>

    <!-- Card 1: Full-Stack Architecture -->
    <g transform="translate(0, 38)">
      <rect x="0" y="0" width="260" height="84" rx="4" fill="url(#cardBg)" stroke="#263C31" stroke-width="1" />
      <text x="16" y="26" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">⚡ Full-Stack Platforms</text>
      <text x="16" y="46" fill="#9FA693" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Next.js 16 App Router &bull; React 19</text>
      <text x="16" y="66" fill="#B39A61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">TypeScript &bull; Tailwind CSS v4</text>
    </g>

    <!-- Card 2: Algorithmic Problem Solving -->
    <g transform="translate(280, 38)">
      <rect x="0" y="0" width="260" height="84" rx="4" fill="url(#cardBg)" stroke="#263C31" stroke-width="1" />
      <text x="16" y="26" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">⚔️ Algorithmic Rigor</text>
      <text x="16" y="46" fill="#9FA693" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Data Structures &bull; Graph Theory</text>
      <text x="16" y="66" fill="#B39A61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">C++20 &bull; LeetCode &bull; Codeforces</text>
    </g>

    <!-- Card 3: Cloud & Persistence -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="260" height="84" rx="4" fill="url(#cardBg)" stroke="#263C31" stroke-width="1" />
      <text x="16" y="26" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">☁️ Cloud &amp; Persistence</text>
      <text x="16" y="46" fill="#9FA693" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Supabase BaaS &bull; PostgreSQL</text>
      <text x="16" y="66" fill="#B39A61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Auth &bull; Row Level Security (RLS)</text>
    </g>

    <!-- Card 4: Interactive 3D Web -->
    <g transform="translate(280, 134)">
      <rect x="0" y="0" width="260" height="84" rx="4" fill="url(#cardBg)" stroke="#263C31" stroke-width="1" />
      <text x="16" y="26" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">🎮 Interactive 3D Web</text>
      <text x="16" y="46" fill="#9FA693" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Three.js &bull; React Three Fiber</text>
      <text x="16" y="66" fill="#B39A61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Monaco Editor &bull; Framer Motion</text>
    </g>
  </g>
</svg>
