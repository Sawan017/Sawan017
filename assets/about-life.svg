<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Sapphire Gradient Header -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4169C1" />
      <stop offset="50%" stop-color="#6289E8" />
      <stop offset="100%" stop-color="#DCE4F0" />
    </linearGradient>

    <!-- Deep Blue Grid Pattern -->
    <pattern id="cardGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#162746" stroke-width="0.6" />
    </pattern>
  </defs>

  <!-- Deep Midnight Blue Base (#101B35) -->
  <rect width="1200" height="300" fill="#101B35" />
  <rect width="1200" height="300" fill="url(#cardGrid)" opacity="0.8" />
  <rect x="1" y="1" width="1198" height="298" fill="none" stroke="#30486D" stroke-width="1.2" rx="6" />

  <!-- Corner Accents (Sapphire) -->
  <g stroke="#6289E8" stroke-width="1.2" opacity="0.85">
    <path d="M 12 24 L 12 12 L 24 12" fill="none" />
    <path d="M 1188 24 L 1188 12 L 1176 12" fill="none" />
    <path d="M 12 276 L 12 288 L 24 288" fill="none" />
    <path d="M 1188 276 L 1188 288 L 1176 288" fill="none" />
  </g>

  <!-- LEFT PANEL: Narrative Developer Overview (#142441 surface) -->
  <g transform="translate(40, 30)">
    <rect width="530" height="240" rx="5" fill="#142441" stroke="#30486D" stroke-width="1" />

    <!-- Panel Header Tag -->
    <g transform="translate(24, 20)">
      <rect x="0" y="0" width="110" height="20" rx="3" fill="#1B3155" stroke="#4169C1" stroke-width="0.8" />
      <text x="55" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">BACKGROUND</text>
    </g>

    <!-- Narrative Heading -->
    <text x="24" y="68" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3">
      Systems Discipline &amp; Natural Craft
    </text>

    <!-- Bio Description -->
    <text x="24" y="98" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" line-height="1.6">
      <tspan x="24" dy="0">I am <tspan fill="#DCE4F0" font-weight="700">Sawan Sahani</tspan>, a Computer Science &amp; Engineering undergraduate</tspan>
      <tspan x="24" dy="18">dedicated to building high-performance full-stack web architectures and</tspan>
      <tspan x="24" dy="18">mastering asymptotic algorithmic problem-solving. My work balances</tspan>
      <tspan x="24" dy="18">defensive cloud engineering with tactile, interactive user interfaces.</tspan>
    </text>

    <!-- Highlight System Motto Capsule (#1B3155) -->
    <g transform="translate(24, 182)">
      <rect x="0" y="0" width="482" height="38" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
      <text x="16" y="24" fill="#6289E8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">
        &quot;Rigorous logic beneath the surface; intentional design on top.&quot;
      </text>
    </g>
  </g>

  <!-- RIGHT PANEL: 4 Core Disciplines (#142441 surface) -->
  <g transform="translate(610, 30)">
    <rect width="550" height="240" rx="5" fill="#142441" stroke="#30486D" stroke-width="1" />

    <!-- Panel Header Tag -->
    <g transform="translate(24, 20)">
      <rect x="0" y="0" width="130" height="20" rx="3" fill="#1B3155" stroke="#4169C1" stroke-width="0.8" />
      <text x="65" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">CORE DISCIPLINES</text>
    </g>

    <!-- 2x2 Grid of Engineering Disciplines (Cards: #1B3155 / #223B63) -->
    <!-- Card 1: Full-Stack Platforms -->
    <g transform="translate(24, 55)">
      <rect width="240" height="75" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
      <text x="14" y="24" fill="#6289E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ Full-Stack Platforms</text>
      <text x="14" y="42" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">Next.js 16 App Router • React 19</text>
      <text x="14" y="58" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">TypeScript • Tailwind CSS v4</text>
    </g>

    <!-- Card 2: Algorithmic Rigor -->
    <g transform="translate(284, 55)">
      <rect width="240" height="75" rx="4" fill="#223B63" stroke="#4169C1" stroke-width="0.8" />
      <text x="14" y="24" fill="#6289E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚔️ Algorithmic Rigor</text>
      <text x="14" y="42" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">Data Structures • Graph Theory</text>
      <text x="14" y="58" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">C++20 • LeetCode • Codeforces</text>
    </g>

    <!-- Card 3: Cloud & Persistence -->
    <g transform="translate(24, 145)">
      <rect width="240" height="75" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
      <text x="14" y="24" fill="#6289E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">☁️ Cloud &amp; Persistence</text>
      <text x="14" y="42" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">Supabase BaaS • PostgreSQL</text>
      <text x="14" y="58" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Auth • Row Level Security (RLS)</text>
    </g>

    <!-- Card 4: Interactive 3D Web -->
    <g transform="translate(284, 145)">
      <rect width="240" height="75" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
      <text x="14" y="24" fill="#6289E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🎮 Interactive 3D Web</text>
      <text x="14" y="42" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">Three.js • React Three Fiber</text>
      <text x="14" y="58" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Monaco Editor • Framer Motion</text>
    </g>
  </g>
</svg>
