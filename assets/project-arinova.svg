<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="580" height="280">
  <!-- Card Background -->
  <rect width="580" height="280" fill="#171A18" />
  <rect width="580" height="280" fill="#1C201E" opacity="0.6" />
  <rect x="0.5" y="0.5" width="579" height="279" fill="none" stroke="#2C332D" stroke-width="1" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="580" height="2" fill="#24382F" />
  <rect x="0" y="0" width="140" height="2" fill="#69735A" />

  <!-- Top Badge -->
  <g transform="translate(24, 22)">
    <rect width="180" height="22" rx="4" fill="#24382F" stroke="#37453C" stroke-width="1" />
    <circle cx="12" cy="11" r="3" fill="#829078" />
    <text x="22" y="15" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">FLAGSHIP • CAREER RPG</text>
  </g>

  <!-- Right Geometric Conceptual Illustration: Isometric RPG World Node -->
  <g transform="translate(485, 75)" opacity="0.65">
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#24382F" stroke-width="1" stroke-dasharray="3 3" />
    <!-- Isometric Cube / Crystal -->
    <polygon points="0,-28 24,-12 0,4 -24,-12" fill="#454C35" />
    <polygon points="0,4 24,-12 24,14 0,30" fill="#24382F" />
    <polygon points="0,4 -24,-12 -24,14 0,30" fill="#1B2620" />
    <line x1="0" y1="4" x2="0" y2="30" stroke="#69735A" stroke-width="0.8" />
    <circle cx="32" cy="-14" r="2" fill="#829078" />
    <circle cx="-35" cy="10" r="1.8" fill="#69735A" />
  </g>

  <!-- Title -->
  <text x="24" y="78" fill="#EDECE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">
    ARINOVA
  </text>
  <text x="150" y="78" fill="#829078" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    Gamified Developer Universe
  </text>

  <!-- Description -->
  <text x="24" y="108" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" line-height="18">
    <tspan x="24" dy="0">A futuristic developer career RPG transforming real learning, quests,</tspan>
    <tspan x="24" dy="18">and milestones into an interactive adventure with a 3D realm,</tspan>
    <tspan x="24" dy="18">dynamic skill trees, XP progression, and real-time social networking.</tspan>
  </text>

  <!-- Feature Strip -->
  <g transform="translate(24, 170)">
    <rect width="532" height="32" rx="4" fill="#151816" stroke="#262D27" stroke-width="0.8" />
    <text x="14" y="20" fill="#829078" font-family="'Fira Code', Consolas, monospace" font-size="10.5" font-weight="600">
      CORE: Interactive 3D Realm • Quest Roadmaps • Realtime Presence
    </text>
  </g>

  <!-- Stack Pills Bar -->
  <g transform="translate(24, 222)">
    <rect x="0" y="0" width="70" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="35" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">React 19</text>

    <rect x="78" y="0" width="86" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="121" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="172" y="0" width="94" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="219" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Three.js / R3F</text>

    <rect x="274" y="0" width="80" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="314" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Supabase</text>

    <rect x="362" y="0" width="76" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="400" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Monaco</text>

    <rect x="446" y="0" width="96" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="494" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Framer Motion</text>
  </g>
</svg>
