<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="580" height="280">
  <!-- Deep Midnight Blue Card Background (#101B35 / #142441) -->
  <rect width="580" height="280" fill="#101B35" />
  <rect width="580" height="280" fill="#142441" opacity="0.75" />
  <rect x="0.5" y="0.5" width="579" height="279" fill="none" stroke="#30486D" stroke-width="1.2" rx="6" />

  <!-- Top Accent Bar (Sapphire Gradient) -->
  <rect x="0" y="0" width="580" height="3" fill="#1B3155" />
  <rect x="0" y="0" width="160" height="3" fill="#6289E8" />

  <!-- Top Badge -->
  <g transform="translate(24, 22)">
    <rect width="180" height="22" rx="4" fill="#1B3155" stroke="#4169C1" stroke-width="0.8" />
    <circle cx="12" cy="11" r="3" fill="#6289E8" />
    <text x="22" y="15" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">FLAGSHIP • CAREER RPG</text>
  </g>

  <!-- Right Geometric Conceptual Illustration: Isometric RPG World Node -->
  <g transform="translate(485, 75)" opacity="0.75">
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#30486D" stroke-width="1" stroke-dasharray="3 3" />
    <!-- Isometric Cube / Crystal -->
    <polygon points="0,-28 24,-12 0,4 -24,-12" fill="#6289E8" />
    <polygon points="0,4 24,-12 24,14 0,30" fill="#4169C1" />
    <polygon points="0,4 -24,-12 -24,14 0,30" fill="#223B63" />
    <line x1="0" y1="4" x2="0" y2="30" stroke="#DCE4F0" stroke-width="0.8" />
    <circle cx="32" cy="-14" r="2.5" fill="#6289E8" />
    <circle cx="-35" cy="10" r="2" fill="#4169C1" />
  </g>

  <!-- Title (Silver #DCE4F0) -->
  <text x="24" y="78" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">
    ARINOVA
  </text>
  <text x="150" y="78" fill="#6289E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    Gamified Developer Universe
  </text>

  <!-- Description (Secondary #AAB8CE) -->
  <text x="24" y="108" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" line-height="18">
    <tspan x="24" dy="0">A futuristic developer career RPG transforming real learning, quests,</tspan>
    <tspan x="24" dy="18">and milestones into an interactive adventure with a 3D realm,</tspan>
    <tspan x="24" dy="18">dynamic skill trees, XP progression, and real-time social networking.</tspan>
  </text>

  <!-- Feature Strip (#1B3155) -->
  <g transform="translate(24, 170)">
    <rect width="532" height="32" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="14" y="20" fill="#6289E8" font-family="'Fira Code', Consolas, monospace" font-size="10.5" font-weight="600">
      CORE: Interactive 3D Realm • Quest Roadmaps • Realtime Presence
    </text>
  </g>

  <!-- Stack Pills Bar -->
  <g transform="translate(24, 222)">
    <rect x="0" y="0" width="75" height="24" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="37" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">React 19</text>

    <rect x="83" y="0" width="86" height="24" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="126" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="177" y="0" width="105" height="24" rx="4" fill="#223B63" stroke="#4169C1" stroke-width="0.8" />
    <text x="229" y="16" fill="#6289E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Three.js / R3F</text>

    <rect x="290" y="0" width="80" height="24" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="330" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Supabase</text>

    <rect x="378" y="0" width="105" height="24" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="430" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Monaco Editor</text>
  </g>
</svg>
