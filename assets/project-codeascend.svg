<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="580" height="280">
  <!-- Deep Midnight Blue Card Background (#101B35 / #142441) -->
  <rect width="580" height="280" fill="#101B35" />
  <rect width="580" height="280" fill="#142441" opacity="0.75" />
  <rect x="0.5" y="0.5" width="579" height="279" fill="none" stroke="#30486D" stroke-width="1.2" rx="6" />

  <!-- Top Accent Bar (Sapphire Gradient) -->
  <rect x="0" y="0" width="580" height="3" fill="#1B3155" />
  <rect x="0" y="0" width="160" height="3" fill="#6289E8" />

  <!-- Top Badge -->
  <g transform="translate(24, 22)">
    <rect width="200" height="22" rx="4" fill="#1B3155" stroke="#4169C1" stroke-width="0.8" />
    <circle cx="12" cy="11" r="3" fill="#6289E8" />
    <text x="22" y="15" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">SKILL ROADMAP • TRACKER</text>
  </g>

  <!-- Right Geometric Conceptual Illustration: Ascending Trajectory & Milestones -->
  <g transform="translate(485, 75)" opacity="0.75">
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#30486D" stroke-width="1" stroke-dasharray="3 3" />
    <!-- Ascending Steps -->
    <rect x="-30" y="6" width="16" height="18" rx="2" fill="#1B3155" stroke="#30486D" stroke-width="1" />
    <rect x="-10" y="-4" width="16" height="28" rx="2" fill="#223B63" stroke="#4169C1" stroke-width="1" />
    <rect x="10" y="-18" width="16" height="42" rx="2" fill="#1B3155" stroke="#6289E8" stroke-width="1.2" />
    <!-- Trajectory Vector -->
    <path d="M -30 6 Q -5 -8 26 -24" fill="none" stroke="#6289E8" stroke-width="1.5" stroke-dasharray="3 2" />
    <circle cx="26" cy="-24" r="3" fill="#DCE4F0" />
    <circle cx="-38" cy="12" r="2" fill="#4169C1" />
  </g>

  <!-- Title (Silver #DCE4F0) -->
  <text x="24" y="78" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">
    CodeAscend
  </text>
  <text x="180" y="78" fill="#6289E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    Progression &amp; Trajectory Tracker
  </text>

  <!-- Description (Secondary #AAB8CE) -->
  <text x="24" y="108" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" line-height="18">
    <tspan x="24" dy="0">A developer progression and skill trajectory platform providing structured</tspan>
    <tspan x="24" dy="18">milestone roadmaps, modular component architectures, cloud-synced state,</tspan>
    <tspan x="24" dy="18">and interactive learning analytics across software engineering domains.</tspan>
  </text>

  <!-- Feature Strip (#1B3155) -->
  <g transform="translate(24, 170)">
    <rect width="532" height="32" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="14" y="20" fill="#6289E8" font-family="'Fira Code', Consolas, monospace" font-size="10.5" font-weight="600">
      CORE: Milestone Roadmap • Trajectory Analytics • Cloud Synchronization
    </text>
  </g>

  <!-- Stack Pills Bar -->
  <g transform="translate(24, 222)">
    <rect x="0" y="0" width="86" height="24" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="43" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="94" y="0" width="75" height="24" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="131" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">React 19</text>

    <rect x="177" y="0" width="85" height="24" rx="4" fill="#223B63" stroke="#4169C1" stroke-width="0.8" />
    <text x="219" y="16" fill="#6289E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Supabase</text>

    <rect x="270" y="0" width="95" height="24" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="317" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Tailwind CSS</text>

    <rect x="373" y="0" width="105" height="24" rx="4" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
    <text x="425" y="16" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">RESTful APIs</text>
  </g>
</svg>
