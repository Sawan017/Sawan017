<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="580" height="280">
  <!-- Card Background -->
  <rect width="580" height="280" fill="#171A18" />
  <rect width="580" height="280" fill="#1C201E" opacity="0.6" />
  <rect x="0.5" y="0.5" width="579" height="279" fill="none" stroke="#2C332D" stroke-width="1" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="580" height="2" fill="#24382F" />
  <rect x="0" y="0" width="140" height="2" fill="#69735A" />

  <!-- Top Badge -->
  <g transform="translate(24, 22)">
    <rect width="210" height="22" rx="4" fill="#24382F" stroke="#37453C" stroke-width="1" />
    <circle cx="12" cy="11" r="3" fill="#829078" />
    <text x="22" y="15" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">GROWTH • CAREER PLATFORM</text>
  </g>

  <!-- Right Geometric Conceptual Illustration: Ascending Milestone Checkpoints -->
  <g transform="translate(485, 75)" opacity="0.65">
    <path d="M -35,22 L -12,8 L 10,-8 L 32,-24" fill="none" stroke="#454C35" stroke-width="1.2" stroke-dasharray="3 3" />
    <circle cx="-35" cy="22" r="4" fill="#1C201E" stroke="#24382F" stroke-width="1.2" />
    <circle cx="-12" cy="8" r="4" fill="#1C201E" stroke="#454C35" stroke-width="1.2" />
    <circle cx="10" cy="-8" r="5" fill="#24382F" stroke="#69735A" stroke-width="1.2" />
    <circle cx="32" cy="-24" r="6" fill="#454C35" stroke="#EDECE6" stroke-width="1.5" />
    <polygon points="32,-27 35,-22 29,-22" fill="#EDECE6" />
  </g>

  <!-- Title -->
  <text x="24" y="78" fill="#EDECE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">
    CodeAscend
  </text>
  <text x="185" y="78" fill="#829078" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    Progression &amp; Mastery Platform
  </text>

  <!-- Description -->
  <text x="24" y="108" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
    <tspan x="24" dy="0">A developer progression and skill trajectory platform featuring</tspan>
    <tspan x="24" dy="18">interactive goal trees, modular UI architectures, real-time</tspan>
    <tspan x="24" dy="18">milestone analytics, and reactive cloud persistence.</tspan>
  </text>

  <!-- Feature Strip -->
  <g transform="translate(24, 170)">
    <rect width="532" height="32" rx="4" fill="#151816" stroke="#262D27" stroke-width="0.8" />
    <text x="14" y="20" fill="#829078" font-family="'Fira Code', Consolas, monospace" font-size="10.5" font-weight="600">
      SYSTEM: Modular Components • Cloud Persistence • Goal Trees
    </text>
  </g>

  <!-- Stack Pills Bar -->
  <g transform="translate(24, 222)">
    <rect x="0" y="0" width="86" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="43" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="94" y="0" width="76" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="132" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">React.js</text>

    <rect x="178" y="0" width="86" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="221" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Supabase</text>

    <rect x="272" y="0" width="98" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="321" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Tailwind CSS</text>

    <rect x="378" y="0" width="86" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="421" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">REST APIs</text>

    <rect x="472" y="0" width="82" height="24" rx="4" fill="#1C211E" stroke="#2C352F" stroke-width="0.8" />
    <text x="513" y="16" fill="#C5C5BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Analytics</text>
  </g>
</svg>
