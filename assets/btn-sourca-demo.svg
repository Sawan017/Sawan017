<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 32" width="240" height="32">
  <defs>
    <clipPath id="btn-clip">
      <rect x="0" y="0" width="240" height="32" rx="4" />
    </clipPath>
  </defs>
  <g clip-path="url(#btn-clip)">
    <!-- Left segment -->
    <rect x="0" y="0" width="110" height="32" fill="#19392D" />
    <!-- Right segment -->
    <rect x="110" y="0" width="130" height="32" fill="#32805B" />
    <!-- Divider line -->
    <line x1="110" y1="0" x2="110" y2="32" stroke="#315544" stroke-width="1.2" />
    
    <!-- Outer border -->
    <rect x="0.5" y="0.5" width="239" height="31" fill="none" stroke="#315544" stroke-width="1" rx="4" />

    <!-- Icon -->
    <g transform="translate(12, 8)">
      <polygon points="3,2 13,8 3,14" fill="#A8BCAF"/>
    </g>

    <!-- Left Text -->
    <text x="34" y="20" fill="#A8BCAF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">LIVE DEMO</text>

    <!-- Right Text -->
    <text x="175" y="20" fill="#E1EAE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">SOURCA ENGINE</text>
  </g>
</svg>