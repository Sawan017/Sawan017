<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171B19" />
      <stop offset="50%" stop-color="#1B221E" />
      <stop offset="100%" stop-color="#151917" />
    </linearGradient>

    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#263C31" />
      <stop offset="50%" stop-color="#B39A61" />
      <stop offset="100%" stop-color="#263C31" />
    </linearGradient>

    <style>
      @keyframes orbitSpin1 {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitSpinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseRing {
        0%, 100% { stroke-opacity: 0.5; }
        50% { stroke-opacity: 0.9; }
      }

      .spin-orbit-1 {
        transform-origin: 200px 115px;
        animation: orbitSpin1 24s linear infinite;
      }
      .spin-orbit-2 {
        transform-origin: 600px 115px;
        animation: orbitSpinRev 28s linear infinite;
      }
      .spin-orbit-3 {
        transform-origin: 1000px 115px;
        animation: orbitSpin1 26s linear infinite;
      }
      .pulse-ellipse {
        animation: pulseRing 4s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .spin-orbit-1, .spin-orbit-2, .spin-orbit-3, .pulse-ellipse {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Base Container -->
  <rect width="1200" height="370" fill="url(#stackBg)" stroke="#263C31" stroke-width="1.2" />

  <!-- Section Header Inside Graphic -->
  <g transform="translate(600, 30)" text-anchor="middle">
    <rect x="-140" y="0" width="280" height="22" rx="3" fill="#1C231F" stroke="#263C31" stroke-width="0.8" />
    <circle cx="-120" cy="11" r="3" fill="#B39A61" />
    <text x="5" y="15" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.5">
      TECHNOLOGY ARSENAL • 3 ORBITS
    </text>
  </g>

  <!-- ============================================== -->
  <!-- THREE ORBITAL SYSTEMS                          -->
  <!-- ============================================== -->

  <!-- ORBIT 1: Core Languages & Logic (Left: cx=200, cy=115) -->
  <g>
    <!-- Center Node -->
    <circle cx="200" cy="115" r="26" fill="#1C231F" stroke="#B39A61" stroke-width="1.5" />
    <text x="200" y="119" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">C++ / TS</text>

    <!-- Elliptical Orbit Rings -->
    <ellipse cx="200" cy="115" rx="85" ry="46" fill="none" stroke="#263C31" stroke-width="1" class="pulse-ellipse" />
    <ellipse cx="200" cy="115" rx="60" ry="32" fill="none" stroke="#454C35" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Orbiting Satellite Assembly -->
    <g class="spin-orbit-1">
      <circle cx="285" cy="115" r="5" fill="#B39A61" />
      <circle cx="115" cy="115" r="4" fill="#657052" />
      <circle cx="200" cy="69" r="3" fill="#E5E0D4" />
      <circle cx="200" cy="161" r="3" fill="#657052" />
    </g>

    <text x="200" y="180" fill="#B39A61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      1. Languages &amp; DSA
    </text>
  </g>

  <!-- ORBIT 2: Frontend & Interactive 3D (Center: cx=600, cy=115) -->
  <g>
    <!-- Center Node -->
    <circle cx="600" cy="115" r="26" fill="#1C231F" stroke="#B39A61" stroke-width="1.5" />
    <text x="600" y="119" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Next / R19</text>

    <!-- Elliptical Orbit Rings -->
    <ellipse cx="600" cy="115" rx="85" ry="46" fill="none" stroke="#263C31" stroke-width="1" class="pulse-ellipse" />
    <ellipse cx="600" cy="115" rx="60" ry="32" fill="none" stroke="#454C35" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Orbiting Satellite Assembly -->
    <g class="spin-orbit-2">
      <circle cx="685" cy="115" r="5" fill="#B39A61" />
      <circle cx="515" cy="115" r="4" fill="#657052" />
      <circle cx="600" cy="69" r="3.5" fill="#E5E0D4" />
      <circle cx="600" cy="161" r="3" fill="#657052" />
    </g>

    <text x="600" y="180" fill="#B39A61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      2. Frontend &amp; 3D Web
    </text>
  </g>

  <!-- ORBIT 3: Backend, Cloud & Tooling (Right: cx=1000, cy=115) -->
  <g>
    <!-- Center Node -->
    <circle cx="1000" cy="115" r="26" fill="#1C231F" stroke="#B39A61" stroke-width="1.5" />
    <text x="1000" y="119" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Supabase</text>

    <!-- Elliptical Orbit Rings -->
    <ellipse cx="1000" cy="115" rx="85" ry="46" fill="none" stroke="#263C31" stroke-width="1" class="pulse-ellipse" />
    <ellipse cx="1000" cy="115" rx="60" ry="32" fill="none" stroke="#454C35" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- Orbiting Satellite Assembly -->
    <g class="spin-orbit-3">
      <circle cx="1085" cy="115" r="5" fill="#B39A61" />
      <circle cx="915" cy="115" r="4" fill="#657052" />
      <circle cx="1000" cy="69" r="3.5" fill="#E5E0D4" />
      <circle cx="1000" cy="161" r="3" fill="#657052" />
    </g>

    <text x="1000" y="180" fill="#B39A61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      3. Cloud &amp; Tooling
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="202" x2="1140" y2="202" stroke="#263C31" stroke-width="0.8" />

  <!-- ============================================== -->
  <!-- CLEARLY READABLE TECHNOLOGY TAXONOMY LIST      -->
  <!-- ============================================== -->

  <!-- Column 1: Languages & Logic -->
  <g transform="translate(60, 220)">
    <rect width="330" height="126" rx="4" fill="#1A211D" stroke="#263C31" stroke-width="0.8" />
    <text x="16" y="24" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">💻 Core Languages &amp; Logic</text>

    <g transform="translate(16, 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      <text x="0" y="0" fill="#B39A61" font-weight="600">• C++ (C++20):</text>
      <text x="90" y="0" fill="#C5C5BA">DSA, STL, Asymptotic Optimization</text>

      <text x="0" y="20" fill="#B39A61" font-weight="600">• TypeScript:</text>
      <text x="90" y="20" fill="#C5C5BA">Strict Type-Safety, Interfaces, Generics</text>

      <text x="0" y="40" fill="#B39A61" font-weight="600">• JavaScript:</text>
      <text x="90" y="40" fill="#C5C5BA">ES6+, Async/Await, V8 Runtime Mechanics</text>

      <text x="0" y="60" fill="#B39A61" font-weight="600">• HTML5 / CSS3:</text>
      <text x="90" y="60" fill="#C5C5BA">Semantic DOM, Vector SVG, CSS Grid</text>
    </g>
  </g>

  <!-- Column 2: Frontend & Interactive 3D -->
  <g transform="translate(435, 220)">
    <rect width="330" height="126" rx="4" fill="#1A211D" stroke="#263C31" stroke-width="0.8" />
    <text x="16" y="24" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🎨 Frontend &amp; Interactive Web</text>

    <g transform="translate(16, 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      <text x="0" y="0" fill="#B39A61" font-weight="600">• React.js (v19):</text>
      <text x="95" y="0" fill="#C5C5BA">Hooks, Reactive UIs, State Trees</text>

      <text x="0" y="20" fill="#B39A61" font-weight="600">• Next.js 16:</text>
      <text x="95" y="20" fill="#C5C5BA">App Router, SSR, Server Components</text>

      <text x="0" y="40" fill="#B39A61" font-weight="600">• Three.js / R3F:</text>
      <text x="95" y="40" fill="#C5C5BA">3D Realms, WebGL, Camera Systems</text>

      <text x="0" y="60" fill="#B39A61" font-weight="600">• Monaco Editor:</text>
      <text x="95" y="60" fill="#C5C5BA">Embedded Coding IDEs &amp; Runners</text>
    </g>
  </g>

  <!-- Column 3: Backend, Cloud & Tooling -->
  <g transform="translate(810, 220)">
    <rect width="330" height="126" rx="4" fill="#1A211D" stroke="#263C31" stroke-width="0.8" />
    <text x="16" y="24" fill="#E5E0D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">☁️ Cloud, Data &amp; Tooling</text>

    <g transform="translate(16, 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      <text x="0" y="0" fill="#B39A61" font-weight="600">• Supabase BaaS:</text>
      <text x="100" y="0" fill="#C5C5BA">PostgreSQL, Auth, Realtime Sync</text>

      <text x="0" y="20" fill="#B39A61" font-weight="600">• PostgreSQL &amp; RLS:</text>
      <text x="100" y="20" fill="#C5C5BA">Relational Modeling, Triggers, Security</text>

      <text x="0" y="40" fill="#B39A61" font-weight="600">• Git &amp; GitHub:</text>
      <text x="100" y="40" fill="#C5C5BA">CI/CD Workflows, Version Integrity</text>

      <text x="0" y="60" fill="#B39A61" font-weight="600">• Google GenAI:</text>
      <text x="100" y="60" fill="#C5C5BA">Intelligent Code Assessment Pipelines</text>
    </g>
  </g>
</svg>
