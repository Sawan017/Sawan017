<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370">
  <defs>
    <!-- Sapphire Gradients -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4169C1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6289E8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Deep Midnight Grid -->
    <pattern id="stackGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#162746" stroke-width="0.6" />
    </pattern>

    <!-- Orbital Rotation Animations -->
    <style>
      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      .orbit-ring-1 {
        transform-origin: 260px 185px;
        animation: spinClockwise 24s linear infinite;
      }
      .orbit-ring-2 {
        transform-origin: 260px 185px;
        animation: spinCounter 36s linear infinite;
      }
      .orbit-ring-3 {
        transform-origin: 260px 185px;
        animation: spinClockwise 48s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .orbit-ring-1, .orbit-ring-2, .orbit-ring-3 {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Deep Midnight Blue Base (#101B35) -->
  <rect width="1200" height="370" fill="#101B35" />
  <rect width="1200" height="370" fill="url(#stackGrid)" opacity="0.85" />
  <rect x="1" y="1" width="1198" height="368" fill="none" stroke="#30486D" stroke-width="1.2" rx="6" />

  <!-- Corner Precision Accents -->
  <g stroke="#6289E8" stroke-width="1.2" opacity="0.85">
    <path d="M 12 24 L 12 12 L 24 12" fill="none" />
    <path d="M 1188 24 L 1188 12 L 1176 12" fill="none" />
    <path d="M 12 346 L 12 358 L 24 358" fill="none" />
    <path d="M 1188 346 L 1188 358 L 1176 358" fill="none" />
  </g>

  <!-- ============================================== -->
  <!-- LEFT: 3 ORBITAL SYSTEMS VISUAL (Centered at 260, 185) -->
  <!-- ============================================== -->

  <!-- Central Star: Systems Core Architecture (#223B63 / #6289E8) -->
  <g transform="translate(260, 185)">
    <circle cx="0" cy="0" r="32" fill="#1B3155" stroke="#4169C1" stroke-width="1.4" />
    <circle cx="0" cy="0" r="24" fill="#223B63" stroke="#6289E8" stroke-width="1" />
    <text x="0" y="4" fill="#DCE4F0" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">CORE</text>
  </g>

  <!-- Orbit 1: Radius 65px (Languages & Logic) -->
  <circle cx="260" cy="185" r="65" fill="none" stroke="#30486D" stroke-width="1" stroke-dasharray="3 3" />
  <g class="orbit-ring-1">
    <!-- Planet Node 1: C++ -->
    <g transform="translate(260, 120)">
      <circle cx="0" cy="0" r="14" fill="#142441" stroke="#6289E8" stroke-width="1.2" />
      <text x="0" y="4" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">C++</text>
    </g>
    <!-- Planet Node 2: TypeScript -->
    <g transform="translate(260, 250)">
      <circle cx="0" cy="0" r="14" fill="#142441" stroke="#4169C1" stroke-width="1.2" />
      <text x="0" y="4" fill="#6289E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">TS</text>
    </g>
  </g>

  <!-- Orbit 2: Radius 105px (Frontend & 3D Web) -->
  <circle cx="260" cy="185" r="105" fill="none" stroke="#223B63" stroke-width="1.2" />
  <g class="orbit-ring-2">
    <!-- Planet Node 3: React / Next -->
    <g transform="translate(186, 111)">
      <circle cx="0" cy="0" r="15" fill="#1B3155" stroke="#6289E8" stroke-width="1.2" />
      <text x="0" y="4" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">React</text>
    </g>
    <!-- Planet Node 4: Three.js -->
    <g transform="translate(334, 259)">
      <circle cx="0" cy="0" r="15" fill="#1B3155" stroke="#4169C1" stroke-width="1.2" />
      <text x="0" y="4" fill="#6289E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">3D</text>
    </g>
  </g>

  <!-- Orbit 3: Radius 145px (Cloud & Tooling) -->
  <circle cx="260" cy="185" r="145" fill="none" stroke="#30486D" stroke-width="0.8" stroke-dasharray="4 4" />
  <g class="orbit-ring-3">
    <!-- Planet Node 5: Supabase -->
    <g transform="translate(363, 83)">
      <circle cx="0" cy="0" r="16" fill="#142441" stroke="#6289E8" stroke-width="1.2" />
      <text x="0" y="4" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" text-anchor="middle">Cloud</text>
    </g>
    <!-- Planet Node 6: Git -->
    <g transform="translate(157, 287)">
      <circle cx="0" cy="0" r="16" fill="#142441" stroke="#4169C1" stroke-width="1.2" />
      <text x="0" y="4" fill="#AAB8CE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" text-anchor="middle">Git</text>
    </g>
  </g>

  <!-- Orbit Section Bottom Label -->
  <text x="260" y="348" fill="#6289E8" font-family="'Fira Code', monospace" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">
    THREE-ORBIT HARMONIC SYSTEM // LIVE
  </text>

  <!-- Vertical Divider Line -->
  <line x1="520" y1="24" x2="520" y2="346" stroke="#30486D" stroke-width="1" />

  <!-- ============================================== -->
  <!-- RIGHT: THREE STRUCTURED CATEGORY CARDS         -->
  <!-- ============================================== -->
  <g transform="translate(545, 20)">

    <!-- Category 1: Languages & Logic (#142441 surface, #1B3155 card) -->
    <g transform="translate(0, 10)">
      <rect width="615" height="96" rx="5" fill="#142441" stroke="#30486D" stroke-width="1" />
      <rect x="0" y="0" width="4" height="96" rx="2" fill="#6289E8" />
      <!-- Header -->
      <g transform="translate(18, 14)">
        <text x="0" y="14" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">
          ⚙️ Languages &amp; Core Logic
        </text>
        <text x="580" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="9" font-weight="700" text-anchor="end">
          TIER 01 // FOUNDATION
        </text>
      </g>
      <!-- Badges -->
      <g transform="translate(18, 48)">
        <!-- C++20 -->
        <g transform="translate(0, 0)">
          <rect width="90" height="26" rx="3" fill="#1B3155" stroke="#4169C1" stroke-width="0.8" />
          <text x="45" y="17" fill="#6289E8" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">C++20</text>
        </g>
        <!-- TypeScript -->
        <g transform="translate(100, 0)">
          <rect width="115" height="26" rx="3" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
          <text x="57" y="17" fill="#DCE4F0" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>
        </g>
        <!-- JavaScript ES6+ -->
        <g transform="translate(225, 0)">
          <rect width="115" height="26" rx="3" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
          <text x="57" y="17" fill="#DCE4F0" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">JavaScript</text>
        </g>
        <!-- Data Structures -->
        <g transform="translate(350, 0)">
          <rect width="130" height="26" rx="3" fill="#223B63" stroke="#4169C1" stroke-width="0.8" />
          <text x="65" y="17" fill="#6289E8" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">DSA &amp; Graphs</text>
        </g>
      </g>
    </g>

    <!-- Category 2: Frontend & 3D Interactive Web (#142441 surface) -->
    <g transform="translate(0, 116)">
      <rect width="615" height="96" rx="5" fill="#142441" stroke="#30486D" stroke-width="1" />
      <rect x="0" y="0" width="4" height="96" rx="2" fill="#4169C1" />
      <!-- Header -->
      <g transform="translate(18, 14)">
        <text x="0" y="14" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">
          🌐 Frontend, Frameworks &amp; 3D
        </text>
        <text x="580" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="9" font-weight="700" text-anchor="end">
          TIER 02 // INTERFACE
        </text>
      </g>
      <!-- Badges -->
      <g transform="translate(18, 48)">
        <!-- Next.js 16 -->
        <g transform="translate(0, 0)">
          <rect width="105" height="26" rx="3" fill="#1B3155" stroke="#4169C1" stroke-width="0.8" />
          <text x="52" y="17" fill="#6289E8" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">Next.js 16</text>
        </g>
        <!-- React 19 -->
        <g transform="translate(115, 0)">
          <rect width="90" height="26" rx="3" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
          <text x="45" y="17" fill="#DCE4F0" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">React 19</text>
        </g>
        <!-- Three.js / R3F -->
        <g transform="translate(215, 0)">
          <rect width="125" height="26" rx="3" fill="#223B63" stroke="#4169C1" stroke-width="0.8" />
          <text x="62" y="17" fill="#6289E8" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">Three.js / R3F</text>
        </g>
        <!-- Tailwind CSS -->
        <g transform="translate(350, 0)">
          <rect width="120" height="26" rx="3" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
          <text x="60" y="17" fill="#DCE4F0" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">Tailwind CSS</text>
        </g>
      </g>
    </g>

    <!-- Category 3: Cloud, Systems & Developer Tooling (#142441 surface) -->
    <g transform="translate(0, 222)">
      <rect width="615" height="96" rx="5" fill="#142441" stroke="#30486D" stroke-width="1" />
      <rect x="0" y="0" width="4" height="96" rx="2" fill="#6289E8" />
      <!-- Header -->
      <g transform="translate(18, 14)">
        <text x="0" y="14" fill="#DCE4F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">
          ☁️ Cloud, Databases &amp; Dev Tooling
        </text>
        <text x="580" y="14" fill="#6289E8" font-family="'Fira Code', monospace" font-size="9" font-weight="700" text-anchor="end">
          TIER 03 // PERSISTENCE
        </text>
      </g>
      <!-- Badges -->
      <g transform="translate(18, 48)">
        <!-- Supabase BaaS -->
        <g transform="translate(0, 0)">
          <rect width="115" height="26" rx="3" fill="#1B3155" stroke="#4169C1" stroke-width="0.8" />
          <text x="57" y="17" fill="#6289E8" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">Supabase BaaS</text>
        </g>
        <!-- PostgreSQL -->
        <g transform="translate(125, 0)">
          <rect width="105" height="26" rx="3" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
          <text x="52" y="17" fill="#DCE4F0" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>
        </g>
        <!-- Git & GitHub -->
        <g transform="translate(240, 0)">
          <rect width="110" height="26" rx="3" fill="#1B3155" stroke="#30486D" stroke-width="0.8" />
          <text x="55" y="17" fill="#DCE4F0" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">Git &amp; GitHub</text>
        </g>
        <!-- Linux / Bash -->
        <g transform="translate(360, 0)">
          <rect width="110" height="26" rx="3" fill="#223B63" stroke="#4169C1" stroke-width="0.8" />
          <text x="55" y="17" fill="#6289E8" font-family="'Fira Code', monospace" font-size="11" font-weight="700" text-anchor="middle">Linux / CLI</text>
        </g>
      </g>
    </g>

  </g>
</svg>
