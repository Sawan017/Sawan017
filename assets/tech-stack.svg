<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15050F" />
      <stop offset="50%" stop-color="#1E0715" />
      <stop offset="100%" stop-color="#12030C" />
    </linearGradient>

    <linearGradient id="colBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#240B1A" />
      <stop offset="100%" stop-color="#180612" />
    </linearGradient>

    <linearGradient id="tagBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#340E24" />
      <stop offset="100%" stop-color="#26091A" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF4F7" />
      <stop offset="100%" stop-color="#ECA8BC" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="360" rx="14" fill="url(#stackBg)" stroke="#451429" stroke-width="1.2" />

  <!-- Section Header Inside SVG -->
  <g transform="translate(600, 36)" text-anchor="middle">
    <rect x="-105" y="0" width="210" height="24" rx="12" fill="#2E0C1F" stroke="#5A1633" stroke-width="1" />
    <text x="0" y="16" fill="#ECA8BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">STACK TAXONOMY</text>
  </g>

  <!-- 4 Columns Grid -->
  <!-- COLUMN 1: Languages & Core -->
  <g transform="translate(36, 76)">
    <rect width="260" height="254" rx="10" fill="url(#colBg)" stroke="#4A142D" stroke-width="1" />
    <!-- Col Header -->
    <rect width="260" height="42" rx="10" fill="#2E0C1F" />
    <rect y="32" width="260" height="10" fill="#2E0C1F" />
    <line x1="0" y1="42" x2="260" y2="42" stroke="#5A1633" stroke-width="1" />
    <text x="20" y="26" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">💻 Languages &amp; Core</text>

    <!-- Items -->
    <!-- C++ -->
    <g transform="translate(16, 56)">
      <rect width="228" height="32" rx="6" fill="url(#tagBg)" stroke="#3E1126" stroke-width="0.8" />
      <text x="14" y="20" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">C++ (C++20)</text>
      <text x="214" y="20" fill="#ECA8BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="end">DSA &bull; STL</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(16, 94)">
      <rect width="228" height="32" rx="6" fill="url(#tagBg)" stroke="#3E1126" stroke-width="0.8" />
      <text x="14" y="20" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">TypeScript</text>
      <text x="214" y="20" fill="#ECA8BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="end">Strict Typing</text>
    </g>
    <!-- JavaScript -->
    <g transform="translate(16, 132)">
      <rect width="228" height="32" rx="6" fill="url(#tagBg)" stroke="#3E1126" stroke-width="0.8" />
      <text x="14" y="20" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">JavaScript (ES6+)</text>
      <text x="214" y="20" fill="#ECA8BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="end">Async &bull; Engine</text>
