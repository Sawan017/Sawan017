    <rect width="260" height="42" rx="10" fill="#2E0C1F" />
    <rect y="32" width="260" height="10" fill="#2E0C1F" />
    <line x1="0" y1="42" x2="260" y2="42" stroke="#5A1633" stroke-width="1" />
    <text x="20" y="26" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🛠️ Developer Workflow</text>

    <!-- Git -->
    <g transform="translate(16, 56)">
      <rect width="228" height="32" rx="6" fill="url(#tagBg)" stroke="#3E1126" stroke-width="0.8" />
      <text x="14" y="20" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Git Version Control</text>
      <text x="214" y="20" fill="#ECA8BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="end">Branch &bull; Merge</text>
    </g>
    <!-- GitHub Actions -->
    <g transform="translate(16, 94)">
      <rect width="228" height="32" rx="6" fill="url(#tagBg)" stroke="#3E1126" stroke-width="0.8" />
      <text x="14" y="20" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">GitHub &amp; CI/CD</text>
      <text x="214" y="20" fill="#ECA8BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="end">Actions &bull; Deploy</text>
    </g>
    <!-- VS Code -->
    <g transform="translate(16, 132)">
      <rect width="228" height="32" rx="6" fill="url(#tagBg)" stroke="#3E1126" stroke-width="0.8" />
      <text x="14" y="20" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">VS Code &amp; Extensions</text>
      <text x="214" y="20" fill="#ECA8BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="end">Debug &bull; Linter</text>
    </g>
    <!-- Vite & Tooling -->
    <g transform="translate(16, 170)">
      <rect width="228" height="32" rx="6" fill="url(#tagBg)" stroke="#3E1126" stroke-width="0.8" />
      <text x="14" y="20" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Vite &amp; Bundlers</text>
      <text x="214" y="20" fill="#ECA8BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="end">HMR &bull; ESBuild</text>
    </g>
    <!-- Linux & Security -->
    <g transform="translate(16, 208)">
      <rect width="228" height="32" rx="6" fill="url(#tagBg)" stroke="#3E1126" stroke-width="0.8" />
      <text x="14" y="20" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Cloudflare Turnstile</text>
      <text x="214" y="20" fill="#ECA8BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="end">Bot &bull; Auth Guard</text>
