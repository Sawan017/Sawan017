      <text x="14" y="20" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">React.js (v19)</text>
      <text x="214" y="20" fill="#ECA8BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="end">Hooks &bull; State</text>
    </g>
    <!-- Next.js -->
    <g transform="translate(16, 94)">
      <rect width="228" height="32" rx="6" fill="url(#tagBg)" stroke="#3E1126" stroke-width="0.8" />
      <text x="14" y="20" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Next.js 16 (App Router)</text>
      <text x="214" y="20" fill="#ECA8BC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="end">SSR &bull; Edge</text>
    </g>
    <!-- Tailwind CSS -->
