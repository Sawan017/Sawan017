<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Velvet Gradient -->
    <linearGradient id="bgVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12040B" />
      <stop offset="35%" stop-color="#1A0612" />
      <stop offset="70%" stop-color="#240B19" />
      <stop offset="100%" stop-color="#12040B" />
    </linearGradient>

    <!-- Jewel Accent Gradient -->
    <linearGradient id="roseJewel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A132C" />
      <stop offset="25%" stop-color="#9C2255" />
      <stop offset="50%" stop-color="#ECA8BC" />
      <stop offset="75%" stop-color="#9C2255" />
      <stop offset="100%" stop-color="#5A132C" />
    </linearGradient>

    <!-- Warm Ivory Gradient for Main Text -->
    <linearGradient id="ivoryText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#E8BCCB" />
    </linearGradient>

    <!-- Pill Container Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#260C1C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#180712" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Tech Lattice Pattern -->
    <pattern id="lattice" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#451429" stroke-width="0.7" opacity="0.35" />
      <circle cx="48" cy="0" r="1.2" fill="#9C2255" opacity="0.4" />
      <circle cx="0" cy="48" r="1.2" fill="#9C2255" opacity="0.4" />
    </pattern>

    <!-- Radial Ambient Wine Glow -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#9C2255" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#5A132C" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#12040B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#B82E64" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#73183B" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#12040B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgVelvet)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowLeft)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowRight)" />
  <rect width="1200" height="360" rx="16" fill="url(#lattice)" />

  <!-- Left Decorative Orbit System -->
  <g opacity="0.3" transform="translate(130, 180)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#7E1944" stroke-width="0.8" stroke-dasharray="3 4" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#B82E64" stroke-width="0.9" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#ECA8BC" stroke-width="0.6" stroke-dasharray="2 3" />
    <circle cx="53" cy="-53" r="3" fill="#ECA8BC" />
    <circle cx="-65" cy="37" r="2.5" fill="#9C2255" />
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#7E1944" stroke-width="0.5" stroke-opacity="0.5" />
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#7E1944" stroke-width="0.5" stroke-opacity="0.5" />
    <polygon points="0,-75 5,-70 0,-65 -5,-70" fill="#ECA8BC" />
  </g>

  <!-- Right Decorative Geometric Isogrid Accent -->
  <g opacity="0.3" transform="translate(1070, 180)">
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="#7E1944" stroke-width="0.9" />
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="none" stroke="#B82E64" stroke-width="0.8" stroke-dasharray="4 3" />
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#ECA8BC" stroke-width="0.6" stroke-dasharray="2 2" />
    <line x1="-69" y1="-40" x2="69" y2="40" stroke="#7E1944" stroke-width="0.5" />
    <line x1="-69" y1="40" x2="69" y2="-40" stroke="#7E1944" stroke-width="0.5" />
    <circle cx="0" cy="-80" r="3" fill="#ECA8BC" />
    <circle cx="69" cy="40" r="2.5" fill="#ECA8BC" />
    <circle cx="-69" cy="40" r="2.5" fill="#ECA8BC" />
  </g>

  <!-- Outer Architectural Framing Border -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="15" fill="none" stroke="#4A142D" stroke-width="1.2" opacity="0.8" />
  <rect x="7" y="7" width="1186" height="346" rx="11" fill="none" stroke="#2D0B1C" stroke-width="0.8" opacity="0.5" stroke-dasharray="6 4" />

  <!-- Bottom Jewel Accent Bar -->
  <rect x="0" y="356" width="1200" height="4" rx="2" fill="url(#roseJewel)" />

  <!-- Central Content -->
  <g text-anchor="middle">

    <!-- Status Capsule Badge -->
    <g transform="translate(600, 38)">
      <rect x="-190" y="0" width="380" height="32" rx="16" fill="url(#pillBg)" stroke="#5A1633" stroke-width="1.2" />
      <circle cx="-162" cy="16" r="4" fill="#ECA8BC">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="r" values="4;4.8;4" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="8" y="21" fill="#F2D8E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.6">FULL-STACK ENGINEER &bull; ALGORITHMIC PRACTITIONER</text>
    </g>

    <!-- Main Headline: Name -->
    <text x="600" y="132" fill="url(#ivoryText)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Playfair Display', Georgia, serif" font-size="52" font-weight="800" letter-spacing="-0.8">Sawan Sahani</text>

    <!-- Stylized Monospace Handle -->
    <g transform="translate(600, 168)">
      <text x="0" y="0" fill="#D96B8A" font-family="'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace" font-size="19" font-weight="600" letter-spacing="1">@Sawan017</text>
      <polygon points="-80,-6 -74,-1 -80,4 -86,-1" fill="#7E1944" />
      <polygon points="80,-6 86,-1 80,4 74,-1" fill="#7E1944" />
    </g>

    <!-- Value Statement / Editorial Subtitle -->
    <text x="600" y="210" fill="#E2C4D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" letter-spacing="0.3">
      Architecting resilient full-stack systems, interactive 3D platforms &amp; high-performance algorithms.
    </text>

    <!-- Three Architectural Pillar Capsules -->
    <g transform="translate(600, 252)">
      <!-- Card 1: Interactive & 3D RPGs -->
      <g transform="translate(-320, 0)">
        <rect x="-135" y="0" width="270" height="42" rx="10" fill="#1C0713" stroke="#4A142D" stroke-width="1.1" />
        <text x="0" y="19" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🎮 Interactive Systems &amp; RPGs</text>
        <text x="0" y="33" fill="#B38699" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">React 19 &bull; Three.js &bull; Supabase</text>
      </g>

      <!-- Card 2: Full-Stack Engineering -->
      <g transform="translate(0, 0)">
        <rect x="-135" y="0" width="270" height="42" rx="10" fill="#1C0713" stroke="#5A1633" stroke-width="1.2" />
        <text x="0" y="19" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ Modern Web Ecosystem</text>
        <text x="0" y="33" fill="#B38699" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">Next.js &bull; TypeScript &bull; Cloud APIs</text>
      </g>

      <!-- Card 3: Algorithmic Mastery -->
      <g transform="translate(320, 0)">
        <rect x="-135" y="0" width="270" height="42" rx="10" fill="#1C0713" stroke="#4A142D" stroke-width="1.1" />
        <text x="0" y="19" fill="#FFF7F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚔️ Algorithmic Problem Solving</text>
        <text x="0" y="33" fill="#B38699" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">C++ &bull; DSA &bull; LeetCode &bull; Codeforces</text>
      </g>
    </g>

    <!-- Subtle Star Accents -->
    <g fill="#ECA8BC" opacity="0.6">
      <path d="M 370 120 Q 370 126 376 126 Q 370 126 370 132 Q 370 126 364 126 Q 370 126 370 120 Z" />
      <path d="M 830 115 Q 830 121 836 121 Q 830 121 830 127 Q 830 121 824 121 Q 830 121 830 115 Z" />
    </g>

  </g>
</svg>
