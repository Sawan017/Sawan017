<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="50%" stop-color="#111C2E" />
      <stop offset="100%" stop-color="#17263B" />
    </linearGradient>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.5" />
      <circle cx="0" cy="0" r="1.5" fill="#3B82F6" opacity="0.4" />
    </pattern>

    <!-- Emerald / Mint Accent Gradient -->
    <linearGradient id="emeraldMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="waveEmerald" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#6EE7B7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="url(#techGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="90" r="220" fill="#3B82F6" opacity="0.08" />
  <circle cx="980" cy="120" r="200" fill="#22C55E" opacity="0.07" />

  <!-- Animated Fluid Waves at Bottom -->
  <path fill="url(#waveBlue)">
    <animate attributeName="d" dur="14s" repeatCount="indefinite"
      values="
        M0,230 Q300,190 600,230 T1200,220 L1200,320 L0,320 Z;
        M0,220 Q300,250 600,210 T1200,240 L1200,320 L0,320 Z;
        M0,230 Q300,190 600,230 T1200,220 L1200,320 L0,320 Z
      " />
  </path>
  <path fill="url(#waveEmerald)">
    <animate attributeName="d" dur="18s" repeatCount="indefinite"
      values="
        M0,250 Q300,270 600,240 T1200,260 L1200,320 L0,320 Z;
        M0,240 Q300,210 600,260 T1200,230 L1200,320 L0,320 Z;
        M0,250 Q300,270 600,240 T1200,260 L1200,320 L0,320 Z
      " />
  </path>

  <!-- Bottom Accent Border -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#emeraldMint)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6" />

  <!-- Content Elements (Centered) -->
  <g text-anchor="middle">
    <!-- Status Pill -->
    <rect x="470" y="36" width="260" height="30" rx="15" fill="#111C2E" stroke="#334155" stroke-width="1.2" />
    <circle cx="490" cy="51" r="4.5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="606" y="57" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">DEVELOPER PORTFOLIO</text>

    <!-- Main Title / Name -->
    <text x="600" y="132" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5">Sawan Sahani</text>

    <!-- Handle Highlight -->
    <text x="600" y="178" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">@Sawan017</text>

    <!-- Tagline / Subtitle -->
    <text x="600" y="214" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0.3">Computer Science Student &bull; Full-Stack Development &bull; Algorithmic Problem Solving</text>

    <!-- Focus Badges in Banner -->
    <g transform="translate(600, 248)">
      <rect x="-240" y="0" width="150" height="24" rx="12" fill="#17263B" stroke="#334155" stroke-width="1" />
      <text x="-165" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TypeScript &bull; React</text>

      <rect x="-70" y="0" width="140" height="24" rx="12" fill="#17263B" stroke="#334155" stroke-width="1" />
      <text x="0" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Next.js &bull; Supabase</text>

      <rect x="90" y="0" width="150" height="24" rx="12" fill="#17263B" stroke="#334155" stroke-width="1" />
      <text x="165" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">C++ &bull; Algorithms</text>
    </g>
  </g>
</svg>
