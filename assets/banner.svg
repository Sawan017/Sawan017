<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="auto">
  <defs>
    <!-- Background Gradient: Midnight Navy to Dark Slate to Steel Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="50%" stop-color="#151F30" />
      <stop offset="100%" stop-color="#263B55" />
    </linearGradient>

    <!-- Accent Emerald/Mint Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Wave Layer Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#263B55" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#151F30" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)" />

  <!-- Decorative Wave Paths -->
  <path d="M0,200 C300,160 450,240 750,190 C950,155 1100,220 1200,190 L1200,280 L0,280 Z" fill="url(#wave1)" />
  <path d="M0,230 C250,190 500,260 800,220 C1000,195 1120,240 1200,225 L1200,280 L0,280 Z" fill="url(#wave2)" />

  <!-- Accent Border Line at Bottom -->
  <rect x="0" y="276" width="1200" height="4" fill="url(#accentGrad)" />

  <!-- Centered Typography -->
  <g text-anchor="middle">
    <!-- Subtitle Pill / Tag -->
    <rect x="510" y="38" width="180" height="28" rx="14" fill="#0B1220" stroke="#263B55" stroke-width="1.5" />
    <text x="600" y="57" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">PORTFOLIO</text>

    <!-- Main Name -->
    <text x="600" y="124" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Sawan Sahani</text>

    <!-- Handle & Tagline -->
    <text x="600" y="166" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">@Sawan017</text>
    <text x="600" y="198" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Computer Science Student &bull; Full-Stack Development &bull; Algorithmic Problem Solving</text>
  </g>
</svg>
