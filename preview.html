<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profile Preview — Sawan Sahani (@Sawan017)</title>
  <style>
    :root {
      --bg-canvas: #10251F;
      --bg-section: #142E25;
      --bg-card: #19392D;
      --bg-surface: #214635;
      --accent: #32805B;
      --highlight: #68A786;
      --fg-silver: #E1EAE3;
      --fg-secondary: #A8BCAF;
      --border: #315544;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-canvas);
      color: var(--fg-silver);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-header {
      width: 100%;
      max-width: 980px;
      background: var(--bg-section);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .preview-header .brand {
      color: var(--fg-silver);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .preview-header .tag {
      background: var(--bg-card);
      color: var(--highlight);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      border: 1px solid var(--border);
    }
    .markdown-body {
      width: 100%;
      max-width: 980px;
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
    }
    .markdown-body img {
      max-width: 100%;
      height: auto;
      display: inline-block;
      vertical-align: middle;
    }
    .section-gap {
      margin: 28px 0;
    }
    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0 20px 0;
    }
    .divider {
      margin: 32px 0;
      text-align: center;
    }
  </style>
</head>
